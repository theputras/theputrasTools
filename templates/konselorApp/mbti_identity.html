<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Identitas Tes MBTI - The Putras Tools</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
        ></script>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <style>
            [x-cloak] {
                display: none !important;
            }
            body {
                font-family: "Inter", sans-serif;
            }
            .gradient-text {
                background: linear-gradient(135deg, #a78bfa, #818cf8, #6366f1);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
        </style>
    </head>
    <body class="bg-slate-50 text-gray-600 min-h-screen mt-10 lg:mt-0 md:mt-15" x-data="mbtiIdentityApp()">
        <div class="container mx-auto px-4 sm:px-6 py-6 pb-40 max-w-xl">
            <!-- BACK BUTTON -->
            <div class="mb-6">
                <a href="{{ url_for('konselor_mbti_menu') }}" class="inline-flex items-center gap-2 text-xs font-bold text-gray-500 hover:text-violet-500 transition">
                    <i class="fas fa-arrow-left"></i> Kembali ke Menu MBTI
                </a>
            </div>

            <!-- HEADER -->
            <div class="relative mb-8 text-center sm:text-left">
                <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-800 tracking-tight">
                    Verifikasi <span class="gradient-text">Identitas Anda</span>
                </h1>
                <p class="text-sm text-gray-500 mt-1">Harap isi atau cari identitas Anda sebelum memulai tes agar hasil tercatat dengan benar.</p>
            </div>

            <!-- FORM -->
            <form action="{{ url_for('konselor_mbti_identity') }}" method="POST" class="space-y-6">
                <!-- Search Input -->
                <div class="bg-white border border-gray-200 rounded-3xl p-6 shadow-sm">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-search text-violet-500 mr-1.5"></i> Cari Data Mahasiswa (Nama / NIM)
                    </label>
                    <div class="relative">
                        <input
                            type="text"
                            x-model="searchQuery"
                            @input.debounce.500ms="lookupCivitas()"
                            :disabled="loading"
                            placeholder="Ketik nama atau NIM Anda..."
                            class="w-full bg-slate-50 border border-gray-200 rounded-2xl p-4 pr-10 text-gray-800 placeholder-gray-400 focus:border-violet-500/30 focus:bg-white focus:outline-none transition text-sm disabled:opacity-60 disabled:cursor-not-allowed"
                        />
                        <div class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">
                            <i x-show="loading" class="fas fa-spinner fa-spin text-violet-500" x-cloak></i>
                            <i x-show="!loading" class="fas fa-id-badge"></i>
                        </div>
                    </div>

                    <!-- Suggestions list -->
                    <div x-show="suggestions.length > 0" x-cloak
                         class="mt-3 border border-gray-100 rounded-2xl shadow-lg bg-white overflow-hidden divide-y divide-gray-50 max-h-60 overflow-y-auto">
                        <template x-for="(res, idx) in suggestions" :key="idx">
                            <button type="button" 
                                    @click="selectIdentity(res)"
                                    class="w-full text-left p-4 hover:bg-violet-50 transition flex items-center gap-4 group">
                                <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 transition-colors"
                                     :class="res.is_local ? 'bg-emerald-50 text-emerald-600' : 'bg-violet-50 text-violet-500'">
                                    <i class="text-xs transition-all" :class="res.is_local ? 'fas fa-user-check' : 'fas fa-user-graduate'"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center gap-2">
                                        <p class="text-sm font-bold text-gray-800 group-hover:text-violet-700 transition truncate" x-text="res.nama_raw"></p>
                                        <span x-show="res.is_local" class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[9px] font-bold bg-emerald-50 text-emerald-600 border border-emerald-100/50 flex-shrink-0" x-cloak>
                                            <i class="fas fa-check text-[8px]"></i> Binaan
                                        </span>
                                    </div>
                                    <p class="text-[10px] text-gray-400 truncate mt-0.5" x-text="res.nim + ' &bull; ' + res.prodi"></p>
                                </div>
                                <i class="fas fa-chevron-right text-gray-300 group-hover:text-violet-400 transition-transform group-hover:translate-x-1"></i>
                            </button>
                        </template>
                    </div>

                    <div class="mt-4 flex items-center justify-between text-xs text-gray-400">
                        <span>Tidak menemukan nama Anda?</span>
                        <button type="button" @click="enableManualInput()" class="text-violet-500 hover:text-violet-600 font-bold underline">
                            Input Secara Manual
                        </button>
                    </div>
                </div>

                <!-- Verified Identity Card / Manual Form -->
                <div class="bg-white border border-gray-200 rounded-3xl p-6 shadow-sm space-y-4" x-show="confirmed || manualMode" x-cloak>
                    <h3 class="text-xs font-bold text-violet-500 uppercase tracking-wider">
                        <span x-show="manualMode">Input Identitas Manual</span>
                        <span x-show="confirmed">Identitas Terpilih</span>
                    </h3>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Nama Lengkap</label>
                            <input type="text" name="nama" x-model="selectedData.nama" required :readonly="!manualMode"
                                   class="w-full bg-slate-50 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-800 focus:border-violet-500 focus:outline-none transition"
                                   :class="!manualMode ? 'opacity-85 pointer-events-none' : 'bg-white'">
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">NIM (Nomor Induk Mahasiswa)</label>
                                <input type="text" name="nim" x-model="selectedData.nim" required :readonly="!manualMode"
                                       class="w-full bg-slate-50 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-800 focus:border-violet-500 focus:outline-none transition"
                                       :class="!manualMode ? 'opacity-85 pointer-events-none' : 'bg-white'">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Program Studi / Fakultas</label>
                                <input type="text" name="prodi" x-model="selectedData.prodi" :readonly="!manualMode"
                                       class="w-full bg-slate-50 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-800 focus:border-violet-500 focus:outline-none transition"
                                       :class="!manualMode ? 'opacity-85 pointer-events-none' : 'bg-white'">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SUBMIT BUTTON -->
                <button
                    type="submit"
                    :disabled="!selectedData.nama || !selectedData.nim"
                    class="w-full bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-violet-600/20 transition-all duration-300 active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 text-sm"
                >
                    <i class="fas fa-play text-xs"></i>
                    <span>Mulai Tes MBTI</span>
                </button>
            </form>
        </div>

        {% include 'nativeNav.html' %}

        <script>
            function mbtiIdentityApp() {
                return {
                    searchQuery: "",
                    suggestions: [],
                    loading: false,
                    confirmed: false,
                    manualMode: false,
                    selectedData: {
                        nama: "",
                        nim: "",
                        prodi: ""
                    },

                    async lookupCivitas() {
                        const q = this.searchQuery.trim();
                        if (q.length < 3) {
                            this.suggestions = [];
                            return;
                        }
                        this.loading = true;
                        try {
                            const res = await fetch(`{{ url_for("konselor_lookup_civitas") }}?query=${encodeURIComponent(q)}`);
                            const data = await res.json();
                            if (data.success) {
                                this.suggestions = data.data;
                            } else {
                                this.suggestions = [];
                            }
                        } catch (err) {
                            console.error(err);
                        } finally {
                            this.loading = false;
                        }
                    },

                    selectIdentity(item) {
                        this.selectedData.nama = item.nama_raw;
                        this.selectedData.nim = item.nim;
                        this.selectedData.prodi = item.prodi;
                        this.confirmed = true;
                        this.manualMode = false;
                        this.suggestions = [];
                        this.searchQuery = "";
                    },

                    enableManualInput() {
                        this.selectedData.nama = "";
                        this.selectedData.nim = "";
                        this.selectedData.prodi = "";
                        this.confirmed = false;
                        this.manualMode = true;
                        this.suggestions = [];
                        this.searchQuery = "";
                    }
                };
            }
        </script>
    </body>
</html>
