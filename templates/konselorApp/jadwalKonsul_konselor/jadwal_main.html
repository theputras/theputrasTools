<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Konseling - Konselor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Inter', sans-serif; }
        .gradient-text {
            background: linear-gradient(135deg, #a78bfa, #818cf8, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .card-glow { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-glow:hover { box-shadow: 0 0 30px -5px rgba(139, 92, 246, 0.15); }
        
        .time-slot { @apply cursor-pointer py-2 text-center rounded-xl text-xs font-bold transition-all border; }
        .time-slot.available { @apply border-violet-200 text-violet-600 bg-violet-50 hover:bg-violet-100 hover:border-violet-300; }
        .time-slot.selected { @apply border-violet-600 text-white bg-violet-600 shadow-md shadow-violet-600/30 ring-2 ring-violet-600/20; }
        .time-slot.booked { @apply border-gray-100 text-gray-400 bg-gray-50 cursor-not-allowed opacity-60; }
    </style>
</head>
<body class="bg-slate-50 text-gray-600 min-h-screen" x-data="jadwalApp()" x-init="init()">

    <div class="container mx-auto px-4 sm:px-6 py-6 pb-40 max-w-5xl">

        <!-- HEADER -->
        <div class="mb-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <a href="/konselor"
                   class="w-10 h-10 flex items-center justify-center rounded-full bg-white border border-gray-200 text-gray-800 transition hover:bg-white active:scale-95">
                    <i class="fas fa-arrow-left text-sm"></i>
                </a>
                <div>
                    <h1 class="text-xl sm:text-2xl font-extrabold text-gray-800 tracking-tight">
                        <i class="fas fa-calendar-alt text-violet-500 mr-1"></i> Penjadwalan <span class="gradient-text">Konseling</span>
                    </h1>
                    <p class="text-xs text-gray-500">Kelola jadwal sesi konseling mahasiswa</p>
                </div>
            </div>
            <button @click="openModalBuat()"
                    class="bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-bold px-5 py-3 rounded-2xl shadow-lg shadow-violet-600/20 transition-all duration-300 active:scale-[0.98] flex items-center gap-2 text-sm">
                <i class="fas fa-plus"></i> Buat Jadwal Baru
            </button>
        </div>

        <!-- TABS -->
        <div class="flex p-1.5 bg-white backdrop-blur-md rounded-2xl border border-gray-200 mb-6 w-full sm:w-fit overflow-x-auto no-scrollbar">
            <button @click="activeTab = 'hari_ini'"
                    :class="activeTab === 'hari_ini' ? 'bg-violet-600 text-white shadow-lg shadow-violet-600/20' : 'text-gray-500 hover:text-gray-800'"
                    class="flex-1 sm:flex-none px-6 py-2.5 rounded-xl text-xs font-bold transition-all duration-300 flex items-center justify-center gap-2 whitespace-nowrap">
                <i class="fas fa-clock"></i> Hari Ini
                <span class="ml-1 bg-white/20 text-white px-2 py-0.5 rounded-full text-[10px]" x-show="activeTab === 'hari_ini'" x-text="jadwalHariIni.length"></span>
            </button>
            <button @click="activeTab = 'mendatang'"
                    :class="activeTab === 'mendatang' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/20' : 'text-gray-500 hover:text-gray-800'"
                    class="flex-1 sm:flex-none px-6 py-2.5 rounded-xl text-xs font-bold transition-all duration-300 flex items-center justify-center gap-2 whitespace-nowrap">
                <i class="fas fa-calendar-day"></i> Mendatang
                <span class="ml-1 bg-white/20 text-white px-2 py-0.5 rounded-full text-[10px]" x-show="activeTab === 'mendatang'" x-text="jadwalMendatang.length"></span>
            </button>
        </div>

        <!-- CONTENT: HARI INI -->
        <div x-show="activeTab === 'hari_ini'" x-transition.opacity.duration.300ms class="space-y-4">
            <template x-if="jadwalHariIni.length === 0">
                <div class="card-glow bg-white border border-gray-200 rounded-2xl p-10 text-center">
                    <div class="w-16 h-16 bg-violet-50 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-mug-hot text-violet-500 text-2xl"></i>
                    </div>
                    <h3 class="text-gray-800 font-bold mb-1">Hari yang santai!</h3>
                    <p class="text-sm text-gray-500">Tidak ada jadwal konseling untuk hari ini.</p>
                </div>
            </template>
            
            <template x-for="jadwal in jadwalHariIni" :key="jadwal.id">
                <div class="card-glow bg-white border border-gray-200 rounded-2xl p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                    <div class="flex items-center gap-4">
                        <div class="flex flex-col items-center justify-center w-16 h-16 rounded-2xl bg-violet-50 border border-violet-100 flex-shrink-0">
                            <span class="text-sm font-extrabold text-violet-600" x-text="jadwal.jam"></span>
                            <span class="text-[10px] font-medium text-violet-400">WIB</span>
                        </div>
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full"
                                      :class="jadwal.status === 'Berlangsung' ? 'bg-emerald-50 text-emerald-600' : (jadwal.status === 'Jeda' ? 'bg-orange-50 text-orange-600' : 'bg-amber-50 text-amber-600')"
                                      x-text="jadwal.status === 'Jeda' ? 'Pause Konseling' : jadwal.status"></span>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-50 text-blue-600" x-text="jadwal.layanan"></span>
                            </div>
                            <h4 class="text-base font-bold text-gray-800" x-text="jadwal.nama_sensor || jadwal.nama"></h4>
                            <p class="text-xs text-gray-500 mt-0.5">
                                <i class="fas fa-id-card mr-1 text-gray-400"></i> <span x-text="jadwal.nim"></span>
                                <span class="mx-1">•</span>
                                <i class="fas fa-graduation-cap mr-1 text-gray-400"></i> <span x-text="jadwal.prodi"></span>
                            </p>
                        </div>
                    </div>
                    
                    <div class="w-full sm:w-auto pt-4 sm:pt-0 border-t sm:border-t-0 border-gray-100 flex justify-end">
                        <button @click="openModalAction(jadwal)" 
                                class="w-full sm:w-auto bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white font-bold py-2.5 px-6 rounded-xl text-sm transition-all duration-300 active:scale-95 shadow-md shadow-emerald-500/20 flex items-center justify-center gap-2">
                            <i class="fas fa-sliders-h"></i> <span>Aksi</span>
                        </button>
                    </div>
                </div>
            </template>
        </div>

        <!-- CONTENT: MENDATANG -->
        <div x-show="activeTab === 'mendatang'" x-transition.opacity.duration.300ms x-cloak class="space-y-4">
            <template x-if="jadwalMendatang.length === 0">
                <div class="card-glow bg-white border border-gray-200 rounded-2xl p-10 text-center">
                    <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-calendar-check text-blue-500 text-2xl"></i>
                    </div>
                    <h3 class="text-gray-800 font-bold mb-1">Jadwal Kosong</h3>
                    <p class="text-sm text-gray-500">Belum ada jadwal konseling mendatang.</p>
                </div>
            </template>
            
            <template x-for="jadwal in jadwalMendatang" :key="jadwal.id">
                <div class="card-glow bg-white border border-gray-200 rounded-2xl p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                    <div class="flex items-center gap-4">
                        <div class="flex flex-col items-center justify-center w-16 h-16 rounded-2xl bg-blue-50 border border-blue-100 flex-shrink-0">
                            <span class="text-sm font-extrabold text-blue-600" x-text="formatDateShort(jadwal.tanggal)"></span>
                            <span class="text-[10px] font-bold text-blue-500 mt-0.5" x-text="jadwal.jam"></span>
                        </div>
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-violet-50 text-violet-600" x-text="jadwal.layanan"></span>
                            </div>
                            <h4 class="text-base font-bold text-gray-800" x-text="jadwal.nama_sensor || jadwal.nama"></h4>
                            <p class="text-xs text-gray-500 mt-0.5">
                                <i class="fas fa-id-card mr-1 text-gray-400"></i> <span x-text="jadwal.nim"></span>
                                <span class="mx-1">•</span>
                                <i class="fas fa-graduation-cap mr-1 text-gray-400"></i> <span x-text="jadwal.prodi"></span>
                            </p>
                        </div>
                    </div>
                    
                    <div class="w-full sm:w-auto pt-4 sm:pt-0 border-t sm:border-t-0 border-gray-100 flex justify-end">
                        <button @click="openModalReschedule(jadwal)" 
                                class="w-full sm:w-auto bg-white border border-gray-200 hover:border-blue-500 hover:text-blue-600 text-gray-600 font-bold py-2.5 px-6 rounded-xl text-sm transition-all duration-300 active:scale-95 flex items-center justify-center gap-2">
                            <i class="fas fa-calendar-day"></i> Reschedule
                        </button>
                    </div>
                </div>
            </template>
        </div>

    </div>

    <!-- ========================================== -->
    <!-- MODAL: BUAT JADWAL BARU                  -->
    <!-- ========================================== -->
    <div x-show="showModalBuat" x-cloak
         class="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-0 sm:p-4">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" 
             x-show="showModalBuat"
             x-transition.opacity.duration.300ms
             @click="showModalBuat = false"></div>

        <!-- Modal Content -->
        <div class="relative w-full sm:max-w-lg bg-white border border-gray-200 rounded-t-3xl sm:rounded-2xl shadow-2xl max-h-[90vh] flex flex-col"
             x-show="showModalBuat"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="translate-y-full sm:translate-y-4 opacity-0 scale-95"
             x-transition:enter-end="translate-y-0 opacity-100 scale-100"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="translate-y-0 opacity-100 scale-100"
             x-transition:leave-end="translate-y-full sm:translate-y-4 opacity-0 scale-95">
            
            <div class="flex items-center justify-between p-5 border-b border-gray-100 shrink-0">
                <h3 class="text-sm font-bold text-gray-800 flex items-center gap-2">
                    <i class="fas fa-calendar-plus text-violet-500"></i> Buat Jadwal Baru
                </h3>
                <button @click="showModalBuat = false" class="text-gray-400 hover:text-gray-600 transition">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="p-5 overflow-y-auto space-y-5">
                <!-- NIM Input & Lookup -->
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1.5 ml-1 uppercase tracking-wider">
                        NIM Mahasiswa <span class="text-red-400">*</span>
                    </label>
                    <input type="text" x-model="formBuat.nim" placeholder="Ketik NIM..." @input.debounce.500ms="lookupNIM()"
                           class="w-full bg-slate-50 border border-gray-200 rounded-xl p-3 text-sm text-gray-800 focus:border-violet-500/50 focus:bg-white focus:outline-none transition">
                    
                    <!-- Loading state -->
                    <p x-show="lookupState === 'loading'" class="text-[10px] text-violet-500 font-medium mt-1.5 ml-1 animate-pulse">
                        <i class="fas fa-spinner fa-spin mr-1"></i> Mencari data...
                    </p>
                    <!-- Error state -->
                    <p x-show="lookupState === 'error'" class="text-[10px] text-red-500 font-medium mt-1.5 ml-1">
                        <i class="fas fa-exclamation-circle mr-1"></i> Data tidak ditemukan.
                    </p>
                    
                    <!-- Found State (Readonly info) -->
                    <div x-show="lookupState === 'found'" x-transition class="mt-3 bg-violet-50/50 border border-violet-100 rounded-xl p-3 space-y-2">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-user text-violet-400 w-4 text-center text-xs"></i>
                            <span class="text-xs font-semibold text-gray-800" x-text="formBuat.nama"></span>
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="fas fa-graduation-cap text-violet-400 w-4 text-center text-xs"></i>
                            <span class="text-xs text-gray-600" x-text="formBuat.prodi"></span>
                        </div>
                    </div>
                </div>

                <!-- Jenis Layanan -->
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1.5 ml-1 uppercase tracking-wider">
                        Jenis Layanan <span class="text-red-400">*</span>
                    </label>
                    <select x-model="formBuat.layanan"
                            class="w-full bg-slate-50 border border-gray-200 rounded-xl p-3 text-sm text-gray-800 focus:border-violet-500/50 focus:bg-white focus:outline-none transition appearance-none">
                        <option value="">— Pilih Layanan —</option>
                        {% for item in layanan_list %}
                        <option value="{{ item.id }}">{{ item.nama }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Tanggal -->
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1.5 ml-1 uppercase tracking-wider">
                        Tanggal Sesi <span class="text-red-400">*</span>
                    </label>
                    <input type="date" x-model="formBuat.tanggal" :min="todayDate" @change="fetchTimeSlots(formBuat.tanggal)"
                           class="w-full bg-slate-50 border border-gray-200 rounded-xl p-3 text-sm text-gray-800 focus:border-violet-500/50 focus:bg-white focus:outline-none transition">
                </div>

                <!-- Pilih Jam (Tampil jika tanggal dipilih) -->
                <div x-show="formBuat.tanggal" x-transition class="space-y-4">
                    <!-- Input Jam Bebas -->
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1.5 ml-1 uppercase tracking-wider">
                            Pilih Jam <span class="text-red-400">*</span>
                        </label>
                        <input type="time" x-model="formBuat.jam"
                               class="w-full bg-slate-50 border border-gray-200 rounded-xl p-3 text-sm text-gray-800 focus:border-violet-500/50 focus:bg-white focus:outline-none transition">
                    </div>
                    
                    <!-- Referensi Jadwal Terisi -->
                    <div class="bg-violet-50/50 border border-violet-100 rounded-xl p-4">
                        <h4 class="text-[10px] font-bold text-violet-600 uppercase tracking-widest mb-3 flex items-center gap-2">
                            <i class="fas fa-list-ul"></i> Sesi Terjadwal pada <span x-text="formatDateShort(formBuat.tanggal)"></span>
                        </h4>
                        
                        <div x-show="loadingSlots" class="flex justify-center py-2">
                            <i class="fas fa-spinner fa-spin text-violet-400 text-sm"></i>
                        </div>
                        
                        <div x-show="!loadingSlots">
                            <template x-if="availableSlots.length === 0">
                                <p class="text-xs text-gray-500 italic">Belum ada jadwal, seluruh waktu kosong.</p>
                            </template>
                            
                            <ul class="space-y-2">
                                <template x-for="(slot, i) in availableSlots" :key="i">
                                    <li class="flex items-center gap-3 text-xs bg-white border border-gray-200 px-3 py-2 rounded-lg">
                                        <span class="font-bold text-gray-800 w-12" x-text="slot.jam"></span>
                                        <span class="w-px h-3 bg-gray-200"></span>
                                        <span class="text-gray-600 font-medium truncate flex-1" x-text="slot.nama"></span>
                                        <span class="text-[9px] px-2 py-0.5 bg-gray-100 text-gray-500 rounded-full font-bold" x-text="slot.status"></span>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <div class="p-5 border-t border-gray-100 shrink-0">
                <button @click="simpanJadwal()" :disabled="!isFormBuatValid || isSubmitting"
                        class="w-full bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-violet-600/20 transition-all duration-300 active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 text-sm">
                    <template x-if="isSubmitting"><i class="fas fa-spinner fa-spin"></i></template>
                    <template x-if="!isSubmitting"><i class="fas fa-save"></i></template>
                    <span x-text="isSubmitting ? 'Menyimpan...' : 'Simpan Jadwal'"></span>
                </button>
            </div>
        </div>
    </div>


    <!-- ========================================== -->
    <!-- MODAL: RESCHEDULE                        -->
    <!-- ========================================== -->
    <div x-show="showModalReschedule" x-cloak
         class="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-0 sm:p-4">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" 
             x-show="showModalReschedule"
             x-transition.opacity.duration.300ms
             @click="showModalReschedule = false"></div>

        <!-- Modal Content -->
        <div class="relative w-full sm:max-w-lg bg-white border border-gray-200 rounded-t-3xl sm:rounded-2xl shadow-2xl max-h-[90vh] flex flex-col"
             x-show="showModalReschedule"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="translate-y-full sm:translate-y-4 opacity-0 scale-95"
             x-transition:enter-end="translate-y-0 opacity-100 scale-100"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="translate-y-0 opacity-100 scale-100"
             x-transition:leave-end="translate-y-full sm:translate-y-4 opacity-0 scale-95">
            
            <div class="flex items-center justify-between p-5 border-b border-gray-100 shrink-0">
                <h3 class="text-sm font-bold text-gray-800 flex items-center gap-2">
                    <i class="fas fa-calendar-day text-blue-500"></i> Reschedule Sesi
                </h3>
                <button @click="showModalReschedule = false" class="text-gray-400 hover:text-gray-600 transition">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="p-5 overflow-y-auto space-y-5">
                <!-- Info Jadwal Saat Ini -->
                <div class="bg-blue-50/50 border border-blue-100 rounded-xl p-4">
                    <div class="flex items-center gap-3 mb-2">
                        <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs font-bold">
                            <i class="fas fa-user"></i>
                        </div>
                        <div>
                            <p class="text-sm font-bold text-gray-800" x-text="formReschedule.nama"></p>
                            <p class="text-[10px] text-gray-500" x-text="formReschedule.layanan"></p>
                        </div>
                    </div>
                </div>

                <!-- Tanggal Baru -->
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1.5 ml-1 uppercase tracking-wider">
                        Tanggal Baru <span class="text-red-400">*</span>
                    </label>
                    <input type="date" x-model="formReschedule.tanggalBaru" :min="todayDate" @change="fetchTimeSlots(formReschedule.tanggalBaru)"
                           class="w-full bg-slate-50 border border-gray-200 rounded-xl p-3 text-sm text-gray-800 focus:border-blue-500/50 focus:bg-white focus:outline-none transition">
                </div>

                <!-- Pilih Jam Baru -->
                <div x-show="formReschedule.tanggalBaru" x-transition class="space-y-4">
                    <!-- Input Jam Bebas -->
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1.5 ml-1 uppercase tracking-wider">
                            Pilih Jam Baru <span class="text-red-400">*</span>
                        </label>
                        <input type="time" x-model="formReschedule.jamBaru"
                               class="w-full bg-slate-50 border border-gray-200 rounded-xl p-3 text-sm text-gray-800 focus:border-blue-500/50 focus:bg-white focus:outline-none transition">
                    </div>
                    
                    <!-- Referensi Jadwal Terisi -->
                    <div class="bg-blue-50/50 border border-blue-100 rounded-xl p-4">
                        <h4 class="text-[10px] font-bold text-blue-600 uppercase tracking-widest mb-3 flex items-center gap-2">
                            <i class="fas fa-list-ul"></i> Sesi Terjadwal pada <span x-text="formatDateShort(formReschedule.tanggalBaru)"></span>
                        </h4>
                        
                        <div x-show="loadingSlots" class="flex justify-center py-2">
                            <i class="fas fa-spinner fa-spin text-blue-400 text-sm"></i>
                        </div>
                        
                        <div x-show="!loadingSlots">
                            <template x-if="availableSlots.length === 0">
                                <p class="text-xs text-gray-500 italic">Belum ada jadwal, seluruh waktu kosong.</p>
                            </template>
                            
                            <ul class="space-y-2">
                                <template x-for="(slot, i) in availableSlots" :key="i">
                                    <li class="flex items-center gap-3 text-xs bg-white border border-gray-200 px-3 py-2 rounded-lg">
                                        <span class="font-bold text-gray-800 w-12" x-text="slot.jam"></span>
                                        <span class="w-px h-3 bg-gray-200"></span>
                                        <span class="text-gray-600 font-medium truncate flex-1" x-text="slot.nama"></span>
                                        <span class="text-[9px] px-2 py-0.5 bg-gray-100 text-gray-500 rounded-full font-bold" x-text="slot.status"></span>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <div class="p-5 border-t border-gray-100 shrink-0">
                <button @click="simpanReschedule()" :disabled="!isFormRescheduleValid || isSubmitting"
                        class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-600/20 transition-all duration-300 active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 text-sm">
                    <template x-if="isSubmitting"><i class="fas fa-spinner fa-spin"></i></template>
                    <template x-if="!isSubmitting"><i class="fas fa-save"></i></template>
                    <span x-text="isSubmitting ? 'Menyimpan...' : 'Simpan Perubahan'"></span>
                </button>
            </div>
        </div>
    </div>


    <!-- ========================================== -->
    <!-- MODAL: AKSI JADWAL HARI INI              -->
    <!-- ========================================== -->
    <div x-show="showModalAction" x-cloak
         class="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-0 sm:p-4">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" 
             x-show="showModalAction"
             x-transition.opacity.duration.300ms
             @click="showModalAction = false"></div>

        <!-- Modal Content -->
        <div class="relative w-full sm:max-w-md bg-white border border-gray-200 rounded-t-3xl sm:rounded-2xl shadow-2xl max-h-[90vh] flex flex-col"
             x-show="showModalAction"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="translate-y-full sm:translate-y-4 opacity-0 scale-95"
             x-transition:enter-end="translate-y-0 opacity-100 scale-100"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="translate-y-0 opacity-100 scale-100"
             x-transition:leave-end="translate-y-full sm:translate-y-4 opacity-0 scale-95">
            
            <div class="flex items-center justify-between p-5 border-b border-gray-100 shrink-0 bg-gray-50 rounded-t-3xl sm:rounded-t-2xl">
                <h3 class="text-sm font-bold text-gray-800 flex items-center gap-2">
                    <i class="fas fa-cog text-violet-500"></i> Aksi Sesi Konseling
                </h3>
                <button @click="showModalAction = false" class="text-gray-400 hover:text-gray-600 transition">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="p-6 space-y-4">
                <!-- Info -->
                <div class="text-center mb-6">
                    <div class="w-16 h-16 rounded-full bg-violet-100 text-violet-600 flex items-center justify-center text-xl font-bold mx-auto mb-3">
                        <i class="fas fa-user"></i>
                    </div>
                    <h4 class="font-bold text-gray-800 text-lg" x-text="selectedJadwalAction.nama_sensor || selectedJadwalAction.nama"></h4>
                    <p class="text-xs text-gray-500 mt-1" x-text="selectedJadwalAction.nim + ' • ' + selectedJadwalAction.layanan"></p>
                    <div class="mt-3 inline-block px-3 py-1 rounded-full text-xs font-bold"
                         :class="selectedJadwalAction.status === 'Berlangsung' ? 'bg-emerald-100 text-emerald-700' : (selectedJadwalAction.status === 'Jeda' ? 'bg-orange-100 text-orange-700' : 'bg-amber-100 text-amber-700')">
                         Status: <span x-text="selectedJadwalAction.status === 'Jeda' ? 'Pause Konseling' : selectedJadwalAction.status"></span>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="grid grid-cols-1 gap-3">
                    <button @click="startSession(selectedJadwalAction.id)" 
                            :disabled="['Selesai', 'Dibatalkan'].includes(selectedJadwalAction.status)"
                            class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white font-bold py-3.5 rounded-xl shadow-md shadow-emerald-500/20 transition-all duration-300 active:scale-[0.98] flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fas fa-play-circle text-lg"></i> 
                        <span x-text="['Berlangsung', 'Jeda'].includes(selectedJadwalAction.status) ? 'Lanjutkan Sesi' : 'Mulai Sesi Sekarang'"></span>
                    </button>
                    
                    <div class="flex gap-3">
                        <button @click="showModalAction = false; openModalReschedule(selectedJadwalAction)" 
                                :disabled="['Selesai', 'Dibatalkan'].includes(selectedJadwalAction.status)"
                                class="w-1/2 bg-white border border-gray-200 hover:bg-blue-50 hover:border-blue-200 text-blue-600 font-bold py-3 rounded-xl transition-all duration-300 active:scale-[0.98] flex flex-col items-center justify-center gap-1.5 text-xs disabled:opacity-50 disabled:cursor-not-allowed">
                            <i class="fas fa-calendar-day text-base"></i>
                            <span>Reschedule</span>
                        </button>

                        <button @click="batalKonsul(selectedJadwalAction.id)" 
                                :disabled="isCanceling || ['Selesai', 'Dibatalkan'].includes(selectedJadwalAction.status)"
                                class="w-1/2 bg-white border border-rose-100 hover:bg-rose-50 hover:border-rose-200 text-rose-500 font-bold py-3 rounded-xl transition-all duration-300 active:scale-[0.98] flex flex-col items-center justify-center gap-1.5 text-xs disabled:opacity-50 disabled:cursor-not-allowed">
                            <template x-if="isCanceling"><i class="fas fa-spinner fa-spin text-base"></i></template>
                            <template x-if="!isCanceling"><i class="fas fa-times-circle text-base"></i></template>
                            <span x-text="isCanceling ? 'Batal...' : 'Batalkan'"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>


{% include 'alert.html' %}
<script>
function jadwalApp() {
    return {
        activeTab: 'hari_ini',
        
        showModalBuat: false,
        showModalReschedule: false,
        showModalAction: false,
        isSubmitting: false,
        isCanceling: false,
        selectedJadwalAction: {},
        
        // // Mockup Data
        // jadwalHariIni: [
        //     { id: 1, nim: '23410100001', nama: 'Budi Santoso', prodi: 'S1 Sistem Informasi', layanan: 'Konseling Akademik', jam: '09:00', status: 'Menunggu' },
        //     { id: 2, nim: '23410100002', nama: 'Siti Aminah', prodi: 'S1 DKV', layanan: 'Konseling Pribadi', jam: '13:00', status: 'Berlangsung' }
        // ],
        // jadwalMendatang: [
        //     { id: 3, nim: '23410100003', nama: 'Andi Wijaya', prodi: 'D3 Teknik Komputer', layanan: 'Konseling Karir', tanggal: '2026-05-01', jam: '10:00', status: 'Menunggu' }
        // ],

        // State for form Buat
        formBuat: { nim: '', nama: '', prodi: '', tanggal: '', jam: '', layanan: '' },
        lookupState: '', // '', 'loading', 'found', 'error'
        
        // State for form Reschedule
        formReschedule: { id: null, nama: '', layanan: '', tanggalLama: '', jamLama: '', tanggalBaru: '', jamBaru: '' },

        // Slots
        loadingSlots: false,
        availableSlots: [],

        init() {
            this.loadJadwal();
        },

        async loadJadwal() {
            try {
                const res = await fetch('/konselor/jadwal/data');
                const data = await res.json();
                if (data.success) {
                    this.jadwalHariIni = data.hari_ini;
                    this.jadwalMendatang = data.mendatang;
                }
            } catch (err) {
                console.error("Gagal memuat jadwal:", err);
            }
        },

        get isFormBuatValid() {
            return this.formBuat.nim && this.lookupState === 'found' && this.formBuat.layanan && this.formBuat.tanggal && this.formBuat.jam;
        },

        get todayDate() {
            const today = new Date();
            // Format YYYY-MM-DD
            return today.toISOString().split('T')[0];
        },

        get isFormRescheduleValid() {
            return this.formReschedule.tanggalBaru && this.formReschedule.jamBaru;
        },

        formatDateShort(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return d.getDate() + ' ' + d.toLocaleDateString('id-ID', { month: 'short' });
        },

        async lookupNIM() {
            const nim = this.formBuat.nim.trim();
            if (nim.length < 5) {
                this.lookupState = '';
                this.formBuat.nama = '';
                this.formBuat.nama_asli = '';
                this.formBuat.prodi = '';
                return;
            }
            
            this.lookupState = 'loading';
            try {
                const res = await fetch(`/konselor/lookup-nim?nim=${encodeURIComponent(nim)}`);
                const data = await res.json();
                
                if (data.success) {
                    this.lookupState = 'found';
                    this.formBuat.nama = data.nama_sensor;
                    this.formBuat.nama_asli = data.nama_raw;
                    this.formBuat.prodi = data.prodi;
                } else {
                    this.lookupState = 'error';
                    this.formBuat.nama = '';
                    this.formBuat.nama_asli = '';
                    this.formBuat.prodi = '';
                }
            } catch (err) {
                console.error(err);
                this.lookupState = 'error';
            }
        },

        async fetchTimeSlots(date) {
            this.formBuat.jam = '';
            this.formReschedule.jamBaru = '';
            if (!date) return;
            
            this.loadingSlots = true;
            try {
                const res = await fetch(`/konselor/jadwal/slots?tanggal=${date}`);
                const data = await res.json();
                if (data.success) {
                    this.availableSlots = data.slots;
                }
            } catch (err) {
                console.error("Gagal load slot waktu:", err);
            } finally {
                this.loadingSlots = false;
            }
        },

        openModalBuat() {
            this.formBuat = { nim: '', nama: '', nama_asli: '', prodi: '', tanggal: '', jam: '', layanan: '' };
            this.lookupState = '';
            this.availableSlots = [];
            this.showModalBuat = true;
            document.body.style.overflow = 'hidden';
        },

        openModalReschedule(jadwal) {
            this.formReschedule = {
                id: jadwal.id,
                nama: jadwal.nama,
                layanan: jadwal.layanan,
                tanggalLama: jadwal.tanggal,
                jamLama: jadwal.jam,
                tanggalBaru: '',
                jamBaru: ''
            };
            this.availableSlots = [];
            this.showModalReschedule = true;
            document.body.style.overflow = 'hidden';
        },

        async simpanJadwal() {
            this.isSubmitting = true;
            try {
                const fd = new FormData();
                fd.append('nim', this.formBuat.nim);
                fd.append('nama', this.formBuat.nama_asli || this.formBuat.nama);
                fd.append('prodi', this.formBuat.prodi);
                // Kita perlu layanan_id, bukan text layanannya.
                // Idealnya di select option formBuat.layanan valuenya adalah ID.
                fd.append('layanan_id', this.formBuat.layanan); 
                fd.append('tanggal', this.formBuat.tanggal);
                fd.append('jam', this.formBuat.jam);
                
                const res = await fetch('/konselor/jadwal/create', { method: 'POST', body: fd });
                const data = await res.json();
                
                if (data.success) {
                    if(window.showAlert) window.showAlert('success', data.message);
                    this.showModalBuat = false;
                    document.body.style.overflow = '';
                    this.loadJadwal();
                } else {
                    if(window.showAlert) window.showAlert('error', data.message);
                }
            } catch (err) {
                console.error(err);
                if(window.showAlert) window.showAlert('error', 'Gagal menyimpan jadwal.');
            } finally {
                this.isSubmitting = false;
            }
        },

        async simpanReschedule() {
            this.isSubmitting = true;
            try {
                const fd = new FormData();
                fd.append('id', this.formReschedule.id);
                fd.append('tanggalBaru', this.formReschedule.tanggalBaru);
                fd.append('jamBaru', this.formReschedule.jamBaru);
                
                const res = await fetch('/konselor/jadwal/reschedule', { method: 'POST', body: fd });
                const data = await res.json();
                
                if (data.success) {
                    if(window.showAlert) window.showAlert('success', data.message);
                    this.showModalReschedule = false;
                    document.body.style.overflow = '';
                    this.loadJadwal();
                } else {
                    if(window.showAlert) window.showAlert('error', data.message);
                }
            } catch (err) {
                console.error(err);
                if(window.showAlert) window.showAlert('error', 'Gagal reschedule.');
            } finally {
                this.isSubmitting = false;
            }
        },

        openModalAction(jadwal) {
            this.selectedJadwalAction = jadwal;
            this.showModalAction = true;
            document.body.style.overflow = 'hidden';
        },

        async startSession(id) {
            try {
                // Update status ke Berlangsung dulu
                const fd = new FormData();
                fd.append('id', id);
                fd.append('status', 'Berlangsung');
                await fetch('/konselor/jadwal/update-status', { method: 'POST', body: fd });
            } catch (err) {
                console.error('Gagal update status:', err);
            }
            window.location.href = `/konselor/live-session?id=${id}`;
        },

        async batalKonsul(id) {
            const yakin = await showConfirm('Batalkan Jadwal', 'Apakah Anda yakin ingin membatalkan jadwal ini secara sepihak? Status jadwal akan diubah menjadi Dibatalkan.', 'danger');
            if (!yakin) return;
            
            this.isCanceling = true;
            try {
                const fd = new FormData();
                fd.append('id', id);
                fd.append('status', 'Dibatalkan');
                
                const res = await fetch('/konselor/jadwal/update-status', { method: 'POST', body: fd });
                const data = await res.json();
                
                if (data.success) {
                    if (window.showAlert) window.showAlert('success', 'Jadwal berhasil dibatalkan.');
                    this.showModalAction = false;
                    document.body.style.overflow = '';
                    this.loadJadwal();
                } else {
                    if (window.showAlert) window.showAlert('error', data.message || 'Gagal membatalkan jadwal.');
                }
            } catch (err) {
                console.error(err);
                if (window.showAlert) window.showAlert('error', 'Terjadi kesalahan sistem.');
            } finally {
                this.isCanceling = false;
            }
        }
    }
}
</script>
</body>
</html>
