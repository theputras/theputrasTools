<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesi Sedang Berlangsung - Konselor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-gray-600 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white border border-gray-200 rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-rose-50 p-6 flex flex-col items-center justify-center text-center border-b border-rose-100">
            <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center shadow-sm mb-4">
                <i class="fas fa-desktop text-2xl text-rose-500"></i>
            </div>
            <h2 class="text-lg font-bold text-gray-800">Sesi Sedang Berlangsung</h2>
            <p class="text-sm text-gray-500 mt-2">Sesi konseling ini sudah berstatus <span class="font-bold text-emerald-600">Berlangsung</span>.</p>
        </div>

        <div class="p-6">
            <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 text-sm text-amber-800 mb-6 flex gap-3">
                <i class="fas fa-exclamation-triangle mt-0.5 text-amber-500"></i>
                <p>Jika Anda baru saja me-refresh halaman, atau mencoba membuka sesi ini di perangkat/tab lain, Anda harus <b>Mengambil Alih</b> sesi ini untuk melanjutkannya. Perangkat lama akan otomatis diputus.</p>
            </div>

            <form action="/konselor/live-session?id={{ jadwal.id }}" method="POST" class="flex flex-col gap-3">
                <input type="hidden" name="id" value="{{ jadwal.id }}">
                <button type="submit" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-600/20 transition-all duration-300 active:scale-[0.98] flex items-center justify-center gap-2">
                    <i class="fas fa-play-circle"></i> Gunakan di Sini (Ambil Alih)
                </button>
                <a href="/konselor/jadwal" class="w-full bg-white border border-gray-200 hover:bg-gray-50 text-gray-600 font-bold py-3.5 rounded-xl transition-all duration-300 active:scale-[0.98] text-center flex items-center justify-center gap-2">
                    <i class="fas fa-arrow-left"></i> Kembali ke Jadwal
                </a>
            </form>
        </div>
    </div>

</body>
</html>
