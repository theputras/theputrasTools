<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Master Data - Konselor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Inter', sans-serif; }
        .gradient-text {
            background: linear-gradient(135deg, #a78bfa, #818cf8, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="bg-slate-50 text-gray-600 min-h-screen">

    <div class="container mx-auto px-4 sm:px-6 py-6 pb-40 max-w-3xl"
         x-data="kelolaMasterApp()">

        <!-- HEADER -->
        <div class="mb-8 flex items-center gap-3">
            <a href="{{ url_for('konselor_dashboard') }}"
               class="w-10 h-10 flex items-center justify-center rounded-full bg-white border border-gray-200 text-gray-800 transition hover:bg-white active:scale-95">
                <i class="fas fa-arrow-left text-sm"></i>
            </a>
            <div>
                <h1 class="text-xl sm:text-2xl font-extrabold text-gray-800 tracking-tight">
                    <i class="fas fa-cogs text-violet-500 mr-1"></i> Kelola <span class="gradient-text">Master Data</span>
                </h1>
                <p class="text-xs text-gray-500">Atur kategori masalah dan jenis layanan konseling</p>
            </div>
        </div>

        <!-- TAB SELECTOR -->
        <div class="flex p-1.5 bg-white backdrop-blur-md rounded-2xl border border-gray-200 mb-6 w-fit">
            <button @click="activeTab = 'kategori'"
                    :class="activeTab === 'kategori' ? 'bg-violet-600 text-white shadow-lg shadow-violet-600/20' : 'text-gray-500 hover:text-gray-200'"
                    class="px-5 py-2 rounded-xl text-xs font-bold transition-all duration-300 flex items-center gap-2">
                <i class="fas fa-tags"></i> Kategori Masalah
            </button>
            <button @click="activeTab = 'layanan'"
                    :class="activeTab === 'layanan' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/20' : 'text-gray-500 hover:text-gray-200'"
                    class="px-5 py-2 rounded-xl text-xs font-bold transition-all duration-300 flex items-center gap-2">
                <i class="fas fa-hand-holding-heart"></i> Jenis Layanan
            </button>
            <button @click="activeTab = 'tindak_lanjut'"
                    :class="activeTab === 'tindak_lanjut' ? 'bg-teal-600 text-white shadow-lg shadow-teal-600/20' : 'text-gray-500 hover:text-gray-200'"
                    class="px-5 py-2 rounded-xl text-xs font-bold transition-all duration-300 flex items-center gap-2">
                <i class="fas fa-clipboard-check"></i> Tindak Lanjut
            </button>
        </div>

        <!-- ======================= -->
        <!-- TAB: KATEGORI MASALAH   -->
        <!-- ======================= -->
        <div x-show="activeTab === 'kategori'" x-transition>
            <!-- Add form -->
            <div class="flex gap-2 mb-4">
                <input type="text" x-model="newKategori" placeholder="Nama kategori baru..."
                       @keydown.enter="addKategori()"
                       class="flex-1 bg-white border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-800 placeholder-gray-600 focus:border-violet-500/30 focus:outline-none transition">
                <button @click="addKategori()" :disabled="!newKategori.trim()"
                        class="bg-violet-600 hover:bg-violet-500 disabled:opacity-40 text-white font-bold px-5 py-3 rounded-xl text-sm transition active:scale-95 flex items-center gap-2">
                    <i class="fas fa-plus text-xs"></i> Tambah
                </button>
            </div>

            <!-- List -->
            <div class="bg-white border border-gray-200 rounded-2xl overflow-hidden divide-y divide-gray-200">
                <template x-if="kategoriList.length === 0">
                    <div class="p-8 text-center text-gray-600 text-sm">
                        <i class="fas fa-tags text-2xl mb-2 block"></i>
                        Belum ada kategori masalah
                    </div>
                </template>

                <template x-for="item in kategoriList" :key="item.id">
                    <div class="flex items-center gap-3 p-4 hover:bg-gray-50 transition-colors group">
                        <div class="p-2 bg-amber-50 rounded-lg">
                            <i class="fas fa-tag text-amber-500 text-xs"></i>
                        </div>

                        <!-- View mode -->
                        <template x-if="editKategoriId !== item.id">
                            <div class="flex-1 flex items-center justify-between">
                                <span class="text-sm text-gray-800 font-medium" x-text="item.nama"></span>
                                <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition">
                                    <button @click="startEditKategori(item)" class="text-blue-500 hover:text-blue-300 p-2 rounded-lg hover:bg-blue-50 transition" title="Edit">
                                        <i class="fas fa-edit text-xs"></i>
                                    </button>
                                    <button @click="deleteKategori(item.id, item.nama)" class="text-red-400 hover:text-red-300 p-2 rounded-lg hover:bg-red-500/10 transition" title="Hapus">
                                        <i class="fas fa-trash-alt text-xs"></i>
                                    </button>
                                </div>
                            </div>
                        </template>

                        <!-- Edit mode -->
                        <template x-if="editKategoriId === item.id">
                            <div class="flex-1 flex items-center gap-2">
                                <input type="text" x-model="editKategoriNama"
                                       @keydown.enter="saveEditKategori()"
                                       @keydown.escape="editKategoriId = null"
                                       class="flex-1 bg-white border border-violet-500/30 rounded-lg px-3 py-2 text-sm text-gray-800 focus:outline-none">
                                <button @click="saveEditKategori()" class="text-emerald-500 hover:text-emerald-300 p-2 rounded-lg hover:bg-emerald-50 transition" title="Simpan">
                                    <i class="fas fa-check text-xs"></i>
                                </button>
                                <button @click="editKategoriId = null" class="text-gray-500 hover:text-gray-800 p-2 rounded-lg hover:bg-gray-100 transition" title="Batal">
                                    <i class="fas fa-times text-xs"></i>
                                </button>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>

        <!-- ======================= -->
        <!-- TAB: JENIS LAYANAN      -->
        <!-- ======================= -->
        <div x-show="activeTab === 'layanan'" x-transition x-cloak>
            <!-- Add form -->
            <div class="space-y-3 mb-4">
                <div class="flex gap-2">
                    <input type="text" x-model="newLayanan" placeholder="Nama jenis layanan baru..."
                           @keydown.enter="addLayanan()"
                           class="flex-1 bg-white border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-800 placeholder-gray-600 focus:border-blue-500/30 focus:outline-none transition">
                    <button @click="addLayanan()" :disabled="!newLayanan.trim()"
                            class="bg-blue-600 hover:bg-blue-500 disabled:opacity-40 text-white font-bold px-5 py-3 rounded-xl text-sm transition active:scale-95 flex items-center gap-2">
                        <i class="fas fa-plus text-xs"></i> Tambah
                    </button>
                </div>
                <label class="flex items-center gap-2 ml-1 cursor-pointer select-none">
                    <input type="checkbox" x-model="newLayananMultipleSupport"
                           class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                    <span class="text-xs text-gray-600"><i class="fas fa-users text-blue-400 mr-1"></i>Multiple Support (bisa lebih dari 1 klien)</span>
                </label>
            </div>

            <!-- List -->
            <div class="bg-white border border-gray-200 rounded-2xl overflow-hidden divide-y divide-gray-200">
                <template x-if="layananList.length === 0">
                    <div class="p-8 text-center text-gray-600 text-sm">
                        <i class="fas fa-hand-holding-heart text-2xl mb-2 block"></i>
                        Belum ada jenis layanan
                    </div>
                </template>

                <template x-for="item in layananList" :key="item.id">
                    <div class="flex items-center gap-3 p-4 hover:bg-gray-50 transition-colors group">
                        <div class="p-2 bg-blue-50 rounded-lg">
                            <i class="fas fa-hand-holding-heart text-blue-500 text-xs"></i>
                        </div>

                        <!-- View mode -->
                        <template x-if="editLayananId !== item.id">
                            <div class="flex-1 flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <span class="text-sm text-gray-800 font-medium" x-text="item.nama"></span>
                                    <template x-if="item.value_jenislayanan && item.value_jenislayanan.multipleSupport">
                                        <span class="text-[9px] font-bold px-2 py-0.5 rounded-full bg-violet-100 text-violet-600 uppercase tracking-wider flex items-center gap-1">
                                            <i class="fas fa-users text-[8px]"></i> Multi
                                        </span>
                                    </template>
                                </div>
                                <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition">
                                    <button @click="startEditLayanan(item)" class="text-blue-500 hover:text-blue-300 p-2 rounded-lg hover:bg-blue-50 transition" title="Edit">
                                        <i class="fas fa-edit text-xs"></i>
                                    </button>
                                    <button @click="deleteLayanan(item.id, item.nama)" class="text-red-400 hover:text-red-300 p-2 rounded-lg hover:bg-red-500/10 transition" title="Hapus">
                                        <i class="fas fa-trash-alt text-xs"></i>
                                    </button>
                                </div>
                            </div>
                        </template>

                        <!-- Edit mode -->
                        <template x-if="editLayananId === item.id">
                            <div class="flex-1 space-y-2">
                                <div class="flex items-center gap-2">
                                    <input type="text" x-model="editLayananNama"
                                           @keydown.enter="saveEditLayanan()"
                                           @keydown.escape="editLayananId = null"
                                           class="flex-1 bg-white border border-blue-500/30 rounded-lg px-3 py-2 text-sm text-gray-800 focus:outline-none">
                                    <button @click="saveEditLayanan()" class="text-emerald-500 hover:text-emerald-300 p-2 rounded-lg hover:bg-emerald-50 transition" title="Simpan">
                                        <i class="fas fa-check text-xs"></i>
                                    </button>
                                    <button @click="editLayananId = null" class="text-gray-500 hover:text-gray-800 p-2 rounded-lg hover:bg-gray-100 transition" title="Batal">
                                        <i class="fas fa-times text-xs"></i>
                                    </button>
                                </div>
                                <label class="flex items-center gap-2 ml-1 cursor-pointer select-none">
                                    <input type="checkbox" x-model="editLayananMultipleSupport"
                                           class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                    <span class="text-xs text-gray-600"><i class="fas fa-users text-blue-400 mr-1"></i>Multiple Support</span>
                                </label>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>

        <!-- ======================= -->
        <!-- TAB: TINDAK LANJUT      -->
        <!-- ======================= -->
        <div x-show="activeTab === 'tindak_lanjut'" x-transition x-cloak>
            <!-- Add form -->
            <div class="flex gap-2 mb-4">
                <input type="text" x-model="newTindakLanjut" placeholder="Nama tindak lanjut baru..."
                       @keydown.enter="addTindakLanjut()"
                       class="flex-1 bg-white border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-800 placeholder-gray-600 focus:border-teal-500/30 focus:outline-none transition">
                <button @click="addTindakLanjut()" :disabled="!newTindakLanjut.trim()"
                        class="bg-teal-600 hover:bg-teal-500 disabled:opacity-40 text-white font-bold px-5 py-3 rounded-xl text-sm transition active:scale-95 flex items-center gap-2">
                    <i class="fas fa-plus text-xs"></i> Tambah
                </button>
            </div>

            <!-- List -->
            <div class="bg-white border border-gray-200 rounded-2xl overflow-hidden divide-y divide-gray-200">
                <template x-if="tindakLanjutList.length === 0">
                    <div class="p-8 text-center text-gray-600 text-sm">
                        <i class="fas fa-clipboard-check text-2xl mb-2 block"></i>
                        Belum ada tindak lanjut
                    </div>
                </template>

                <template x-for="item in tindakLanjutList" :key="item.id">
                    <div class="flex items-center gap-3 p-4 hover:bg-gray-50 transition-colors group">
                        <div class="p-2 bg-teal-50 rounded-lg">
                            <i class="fas fa-clipboard-check text-teal-500 text-xs"></i>
                        </div>

                        <!-- View mode -->
                        <template x-if="editTindakLanjutId !== item.id">
                            <div class="flex-1 flex items-center justify-between">
                                <span class="text-sm text-gray-800 font-medium" x-text="item.nama"></span>
                                <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition">
                                    <button @click="startEditTindakLanjut(item)" class="text-teal-500 hover:text-teal-300 p-2 rounded-lg hover:bg-teal-50 transition" title="Edit">
                                        <i class="fas fa-edit text-xs"></i>
                                    </button>
                                    <button @click="deleteTindakLanjut(item.id, item.nama)" class="text-red-400 hover:text-red-300 p-2 rounded-lg hover:bg-red-500/10 transition" title="Hapus">
                                        <i class="fas fa-trash-alt text-xs"></i>
                                    </button>
                                </div>
                            </div>
                        </template>

                        <!-- Edit mode -->
                        <template x-if="editTindakLanjutId === item.id">
                            <div class="flex-1 flex items-center gap-2">
                                <input type="text" x-model="editTindakLanjutNama"
                                       @keydown.enter="saveEditTindakLanjut()"
                                       @keydown.escape="editTindakLanjutId = null"
                                       class="flex-1 bg-white border border-teal-500/30 rounded-lg px-3 py-2 text-sm text-gray-800 focus:outline-none">
                                <button @click="saveEditTindakLanjut()" class="text-emerald-500 hover:text-emerald-300 p-2 rounded-lg hover:bg-emerald-50 transition" title="Simpan">
                                    <i class="fas fa-check text-xs"></i>
                                </button>
                                <button @click="editTindakLanjutId = null" class="text-gray-500 hover:text-gray-800 p-2 rounded-lg hover:bg-gray-100 transition" title="Batal">
                                    <i class="fas fa-times text-xs"></i>
                                </button>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>

    </div>

    {% include 'muslimTools/prayerWidget.html' %}
    {% include 'nativeNav.html' %}

<script>
function kelolaMasterApp() {
    return {
        activeTab: 'kategori',

        // Kategori
        kategoriList: JSON.parse('{{ kategori_list | tojson }}'),
        newKategori: '',
        editKategoriId: null,
        editKategoriNama: '',

        // Layanan
        layananList: JSON.parse('{{ layanan_list | tojson }}'),
        newLayanan: '',
        newLayananMultipleSupport: false,
        editLayananId: null,
        editLayananNama: '',
        editLayananMultipleSupport: false,

        // Tindak Lanjut
        tindakLanjutList: JSON.parse('{{ tindak_lanjut_list | tojson }}'),
        newTindakLanjut: '',
        editTindakLanjutId: null,
        editTindakLanjutNama: '',

        // === KATEGORI CRUD ===
        async addKategori() {
            if (!this.newKategori.trim()) return;
            const fd = new FormData();
            fd.append('nama', this.newKategori.trim());
            fd.append('action', 'create');
            const res = await fetch('{{ url_for("konselor_kategori") }}', { method: 'POST', body: fd });
            const data = await res.json();
            if (data.success) {
                this.kategoriList.push({ id: data.id, nama: this.newKategori.trim() });
                this.newKategori = '';
                if (window.showAlert) window.showAlert('success', data.message);
            } else {
                if (window.showAlert) window.showAlert('error', data.message);
            }
        },

        startEditKategori(item) {
            this.editKategoriId = item.id;
            this.editKategoriNama = item.nama;
        },

        async saveEditKategori() {
            if (!this.editKategoriNama.trim()) return;
            const fd = new FormData();
            fd.append('id', this.editKategoriId);
            fd.append('nama', this.editKategoriNama.trim());
            fd.append('action', 'update');
            const res = await fetch('{{ url_for("konselor_kategori") }}', { method: 'POST', body: fd });
            const data = await res.json();
            if (data.success) {
                const item = this.kategoriList.find(k => k.id === this.editKategoriId);
                if (item) item.nama = this.editKategoriNama.trim();
                this.editKategoriId = null;
                if (window.showAlert) window.showAlert('success', data.message);
            } else {
                if (window.showAlert) window.showAlert('error', data.message);
            }
        },

        async deleteKategori(id, nama) {
            const yakin = window.showConfirm
                ? await window.showConfirm('Hapus Kategori?', `"${nama}" akan dihapus. Gagal jika masih digunakan.`, 'danger')
                : confirm(`Hapus kategori "${nama}"?`);
            if (!yakin) return;

            const fd = new FormData();
            fd.append('id', id);
            fd.append('action', 'delete');
            const res = await fetch('{{ url_for("konselor_kategori") }}', { method: 'POST', body: fd });
            const data = await res.json();
            if (data.success) {
                this.kategoriList = this.kategoriList.filter(k => k.id !== id);
                if (window.showAlert) window.showAlert('success', data.message);
            } else {
                if (window.showAlert) window.showAlert('error', data.message);
            }
        },

        // === LAYANAN CRUD ===
        async addLayanan() {
            if (!this.newLayanan.trim()) return;
            const fd = new FormData();
            fd.append('nama', this.newLayanan.trim());
            fd.append('action', 'create');
            fd.append('multipleSupport', this.newLayananMultipleSupport ? 'true' : 'false');
            const res = await fetch('{{ url_for("konselor_layanan") }}', { method: 'POST', body: fd });
            const data = await res.json();
            if (data.success) {
                this.layananList.push({ id: data.id, nama: this.newLayanan.trim(), value_jenislayanan: data.value_jenislayanan || {} });
                this.newLayanan = '';
                this.newLayananMultipleSupport = false;
                if (window.showAlert) window.showAlert('success', data.message);
            } else {
                if (window.showAlert) window.showAlert('error', data.message);
            }
        },

        startEditLayanan(item) {
            this.editLayananId = item.id;
            this.editLayananNama = item.nama;
            this.editLayananMultipleSupport = !!(item.value_jenislayanan && item.value_jenislayanan.multipleSupport);
        },

        async saveEditLayanan() {
            if (!this.editLayananNama.trim()) return;
            const fd = new FormData();
            fd.append('id', this.editLayananId);
            fd.append('nama', this.editLayananNama.trim());
            fd.append('action', 'update');
            fd.append('multipleSupport', this.editLayananMultipleSupport ? 'true' : 'false');
            const res = await fetch('{{ url_for("konselor_layanan") }}', { method: 'POST', body: fd });
            const data = await res.json();
            if (data.success) {
                const item = this.layananList.find(l => l.id === this.editLayananId);
                if (item) {
                    item.nama = this.editLayananNama.trim();
                    item.value_jenislayanan = data.value_jenislayanan || {};
                }
                this.editLayananId = null;
                if (window.showAlert) window.showAlert('success', data.message);
            } else {
                if (window.showAlert) window.showAlert('error', data.message);
            }
        },

        async deleteLayanan(id, nama) {
            const yakin = window.showConfirm
                ? await window.showConfirm('Hapus Layanan?', `"${nama}" akan dihapus. Gagal jika masih digunakan.`, 'danger')
                : confirm(`Hapus jenis layanan "${nama}"?`);
            if (!yakin) return;

            const fd = new FormData();
            fd.append('id', id);
            fd.append('action', 'delete');
            const res = await fetch('{{ url_for("konselor_layanan") }}', { method: 'POST', body: fd });
            const data = await res.json();
            if (data.success) {
                this.layananList = this.layananList.filter(l => l.id !== id);
                if (window.showAlert) window.showAlert('success', data.message);
            } else {
                if (window.showAlert) window.showAlert('error', data.message);
            }
        },

        // === TINDAK LANJUT CRUD ===
        async addTindakLanjut() {
            if (!this.newTindakLanjut.trim()) return;
            const fd = new FormData();
            fd.append('nama', this.newTindakLanjut.trim());
            fd.append('action', 'create');
            const res = await fetch('{{ url_for("konselor_tindak_lanjut") }}', { method: 'POST', body: fd });
            const data = await res.json();
            if (data.success) {
                this.tindakLanjutList.push({ id: data.new_id, nama: this.newTindakLanjut.trim() });
                this.newTindakLanjut = '';
                if (window.showAlert) window.showAlert('success', data.message);
            } else {
                if (window.showAlert) window.showAlert('error', data.message);
            }
        },

        startEditTindakLanjut(item) {
            this.editTindakLanjutId = item.id;
            this.editTindakLanjutNama = item.nama;
        },

        async saveEditTindakLanjut() {
            if (!this.editTindakLanjutNama.trim()) return;
            const fd = new FormData();
            fd.append('id', this.editTindakLanjutId);
            fd.append('nama', this.editTindakLanjutNama.trim());
            fd.append('action', 'update');
            const res = await fetch('{{ url_for("konselor_tindak_lanjut") }}', { method: 'POST', body: fd });
            const data = await res.json();
            if (data.success) {
                const item = this.tindakLanjutList.find(t => t.id === this.editTindakLanjutId);
                if (item) item.nama = this.editTindakLanjutNama.trim();
                this.editTindakLanjutId = null;
                if (window.showAlert) window.showAlert('success', data.message);
            } else {
                if (window.showAlert) window.showAlert('error', data.message);
            }
        },

        async deleteTindakLanjut(id, nama) {
            const yakin = window.showConfirm
                ? await window.showConfirm('Hapus Tindak Lanjut?', `"${nama}" akan dihapus. Gagal jika masih digunakan.`, 'danger')
                : confirm(`Hapus tindak lanjut "${nama}"?`);
            if (!yakin) return;

            const fd = new FormData();
            fd.append('id', id);
            fd.append('action', 'delete');
            const res = await fetch('{{ url_for("konselor_tindak_lanjut") }}', { method: 'POST', body: fd });
            const data = await res.json();
            if (data.success) {
                this.tindakLanjutList = this.tindakLanjutList.filter(t => t.id !== id);
                if (window.showAlert) window.showAlert('success', data.message);
            } else {
                if (window.showAlert) window.showAlert('error', data.message);
            }
        }
    }
}
</script>
</body>
</html>
