<script src="/static/js/components/ui.js"></script>

<div x-data class="fixed top-5 right-5 z-[100] flex flex-col gap-3 w-full max-w-sm pointer-events-none">
    <template x-for="toast in $store.toast.items" :key="toast.id">
        <div x-show="toast.show" 
             x-transition:enter="transition ease-out duration-300" 
             x-transition:enter-start="opacity-0 translate-x-10" 
             x-transition:enter-end="opacity-100 translate-x-0" 
             x-transition:leave="transition ease-in duration-300" 
             x-transition:leave-start="opacity-100 translate-x-0" 
             x-transition:leave-end="opacity-0 translate-x-10" 
             class="pointer-events-auto bg-gray-900/80 backdrop-blur-md shadow-2xl rounded-2xl p-4 border border-white/10 flex items-start gap-3 text-gray-200">
            
            <div class="flex-shrink-0 pt-0.5">
                <i x-show="toast.type === 'success'" class="fas fa-check-circle text-green-400 drop-shadow-md"></i>
                <i x-show="toast.type === 'error'" class="fas fa-times-circle text-red-400 drop-shadow-md"></i>
                <i x-show="toast.type === 'info'" class="fas fa-info-circle text-blue-400 drop-shadow-md"></i>
            </div>
            <div class="flex-1 text-sm font-medium" x-text="toast.message"></div>
        </div>
    </template>
</div>

<div x-data x-show="$store.confirm.isOpen" class="fixed inset-0 z-[110] flex items-center justify-center px-4" x-cloak>
    <div x-show="$store.confirm.isOpen" 
         x-transition:enter="transition ease-out duration-300" 
         x-transition:enter-start="opacity-0" 
         x-transition:enter-end="opacity-100" 
         x-transition:leave="transition ease-in duration-200" 
         x-transition:leave-start="opacity-100" 
         x-transition:leave-end="opacity-0" 
         @click="$store.confirm.close(false)" 
         class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
    
    <div x-show="$store.confirm.isOpen" 
         x-transition:enter="transition ease-out duration-300" 
         x-transition:enter-start="opacity-0 scale-90 translate-y-4" 
         x-transition:enter-end="opacity-100 scale-100 translate-y-0" 
         x-transition:leave="transition ease-in duration-200" 
         x-transition:leave-start="opacity-100 scale-100 translate-y-0" 
         x-transition:leave-end="opacity-0 scale-90 translate-y-4" 
         class="relative bg-gray-900/80 backdrop-blur-xl rounded-[2rem] shadow-2xl max-w-md w-full p-6 border border-white/10 ring-1 ring-white/5">
        
        <h3 class="text-xl font-bold text-white mb-2" x-text="$store.confirm.title"></h3>
        <p class="text-gray-300 text-sm mb-6 leading-relaxed" x-text="$store.confirm.message"></p>
        
        <div class="flex justify-end gap-3">
            <button @click="$store.confirm.close(false)" 
                    class="px-5 py-2.5 rounded-full text-sm font-medium text-gray-400 hover:text-white hover:bg-white/10 transition border border-transparent hover:border-white/10">
                Batal
            </button>
            <button @click="$store.confirm.close(true)" 
                    :class="$store.confirm.type === 'danger' ? 'bg-red-500/80 hover:bg-red-500 shadow-red-500/20' : 'bg-blue-500/80 hover:bg-blue-500 shadow-blue-500/20'" 
                    class="px-5 py-2.5 rounded-full text-sm font-bold text-white shadow-lg transition transform active:scale-95">
                Ya, Lanjutkan
            </button>
        </div>
    </div>
</div>
