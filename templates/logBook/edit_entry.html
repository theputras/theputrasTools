<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Kegiatan - The Putras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        ::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        [x-cloak] { display: none !important; }
        .editor-content ul { list-style-type: disc !important; padding-left: 1.5em !important; margin-bottom: 0.5em; }
.editor-content ol { list-style-type: decimal !important; padding-left: 1.5em !important; margin-bottom: 0.5em; }
.editor-content p { margin-bottom: 0.5em; }
.editor-content p:last-child { margin-bottom: 0; }
.editor-content strong { font-weight: bold; color: white; }
.editor-content em { font-style: italic; }
.editor-content blockquote { border-left: 4px solid #3b82f6; padding-left: 1em; color: #9ca3af; font-style: italic; margin-bottom: 0.5em; }

    </style>
</head>
<body class="bg-gray-900 text-gray-300 font-sans min-h-screen flex flex-col">
    <div class="flex-1 container mx-auto p-4 sm:p-6 pb-32 max-w-3xl">
        
        <div class="mb-6 flex items-center gap-3">
            <a href="{{ url_for('logbook_detail', logbook_id=logbook.id) }}" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-800 hover:bg-gray-700 text-white transition">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1 class="text-2xl font-bold text-white">Edit Kegiatan Harian</h1>
        </div>

        <div class="bg-gray-800 rounded-2xl shadow-xl border border-white/5 p-6 sm:p-8">
            <form method="POST" enctype="multipart/form-data">
                <div class="grid grid-cols-1 gap-4 mb-4">
                    <div>
                        <label class="block text-sm mb-1 text-gray-400">Tanggal</label>
                        <input type="text" name="tanggal" value="{{ entry.tanggal }}" required class="datepicker w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:border-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm mb-1 text-gray-400">Aktivitas / Judul</label>
                        <input type="text" name="aktivitas" value="{{ entry.aktivitas }}" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:border-blue-500 focus:outline-none">
                    </div>
                   <textarea id="hidden-desc" style="display:none;">{{ entry.deskripsi }}</textarea>

<div class="mb-4" x-data="tiptapEditor(document.getElementById('hidden-desc').value)">
    <label class="block text-sm mb-1 text-gray-400">Deskripsi Pekerjaan</label>
    
    <div class="bg-gray-900 border border-gray-600 rounded-xl flex flex-col focus-within:border-blue-500 transition-colors">
        <div class="bg-gray-800 border-b border-gray-600 p-2 rounded-t-xl min-h-[48px] flex items-center">
            <template x-if="editor">
                <div class="flex flex-wrap gap-1">
                    <button type="button" @click="editor.chain().focus().toggleBold().run()" :class="editor.isActive('bold') ? 'bg-blue-600 text-white' : 'text-gray-400 hover:bg-gray-700'" class="p-2 rounded-lg transition-all text-xs font-bold w-8 h-8 flex items-center justify-center">B</button>
                    <button type="button" @click="editor.chain().focus().toggleItalic().run()" :class="editor.isActive('italic') ? 'bg-blue-600 text-white' : 'text-gray-400 hover:bg-gray-700'" class="p-2 rounded-lg transition-all italic text-xs w-8 h-8 flex items-center justify-center">I</button>
                    <div class="w-px h-5 bg-gray-600 mx-1 my-auto"></div>
                    <button type="button" @click="editor.chain().focus().toggleBulletList().run()" :class="editor.isActive('bulletList') ? 'bg-blue-600 text-white' : 'text-gray-400 hover:bg-gray-700'" class="p-2 rounded-lg transition-all text-xs w-8 h-8 flex items-center justify-center"><i class="fas fa-list-ul"></i></button>
                    <button type="button" @click="editor.chain().focus().toggleOrderedList().run()" :class="editor.isActive('orderedList') ? 'bg-blue-600 text-white' : 'text-gray-400 hover:bg-gray-700'" class="p-2 rounded-lg transition-all text-xs w-8 h-8 flex items-center justify-center"><i class="fas fa-list-ol"></i></button>
                    <div class="w-px h-5 bg-gray-600 mx-1 my-auto"></div>
                    <button type="button" @click="editor.chain().focus().toggleBlockquote().run()" :class="editor.isActive('blockquote') ? 'bg-blue-600 text-white' : 'text-gray-400 hover:bg-gray-700'" class="p-2 rounded-lg transition-all text-xs w-8 h-8 flex items-center justify-center"><i class="fas fa-quote-right"></i></button>
                </div>
            </template>
        </div>
        
        <div x-ref="editorElement"></div>
        <input type="hidden" name="deskripsi" :value="content">
    </div>
</div>
                    
                    <div x-data="imageCropUploader([
    {% if entry.images %}
        {% for img in entry.images %}
            { path: '{{ img.path }}', url: '{{ url_for('static', filename='uploads/logbook/' ~ img.path) }}' }{% if not loop.last %},{% endif %}
        {% endfor %}
    {% endif %}
])" class="mt-4">
    <label class="block text-sm mb-2 text-gray-400">Bukti Gambar Pekerjaan</label>
    
    <template x-for="img in existingImages">
        <input type="hidden" name="existing_images" :value="img.path">
    </template>

    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-4" x-show="existingImages.length > 0 || newImages.length > 0">
        
        <template x-for="(img, index) in existingImages" :key="'old'+index">
            <div class="relative group aspect-video">
                <img :src="img.url" class="w-full h-full object-cover rounded-lg border border-gray-600 shadow-sm opacity-80 group-hover:opacity-100 transition">
                <button type="button" @click="removeExisting(index)" 
                        class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center shadow-lg hover:bg-red-600 transition-transform transform scale-90 group-hover:scale-100">
                    <i class="fas fa-times text-xs"></i>
                </button>
            </div>
        </template>

        <template x-for="(img, index) in newImages" :key="'new'+index">
            <div class="relative group aspect-video">
                <img :src="img.url" class="w-full h-full object-cover rounded-lg border border-green-500 shadow-sm border-2">
                <button type="button" @click="removeNew(index)" 
                        class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center shadow-lg hover:bg-red-600 transition-transform transform scale-90 group-hover:scale-100">
                    <i class="fas fa-times text-xs"></i>
                </button>
            </div>
        </template>
    </div>

   <div 
    @dragover.prevent="isDragging = true" 
    @dragleave.prevent="isDragging = false" 
    @drop.prevent="handleDrop($event)"
    :class="isDragging ? 'border-blue-500 bg-blue-900/20' : 'border-gray-600 bg-gray-900 hover:bg-gray-800'"
    class="relative flex flex-col items-center justify-center w-full h-32 border-2 border-dashed rounded-xl cursor-pointer transition-colors mt-2"
    @click="$refs.fileInput.click()"
>
    <div class="flex flex-col items-center justify-center pt-5 pb-6 pointer-events-none">
        <i class="fas fa-cloud-upload-alt text-4xl mb-3 transition-colors duration-200" 
           :class="isDragging ? 'text-blue-500' : 'text-gray-400'"></i>
        <p class="mb-2 text-sm text-gray-400"><span class="font-bold text-white">Klik untuk upload</span> atau drag and drop ke sini</p>
        <p class="text-xs text-gray-500">PNG, JPG, JPEG (Bisa pilih banyak)</p>
    </div>
    
    <input type="file" x-ref="fileInput" name="gambar" accept="image/*" multiple @change="handleFiles" class="hidden">
</div>
    <div x-show="showModal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/95 p-4" x-cloak>
        <div class="bg-gray-800 rounded-xl p-4 w-full max-w-3xl flex flex-col shadow-2xl border border-gray-600">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-white font-bold">Crop Gambar (<span x-text="currentFileIndex + 1"></span> dari <span x-text="filesToCrop.length"></span>)</h3>
            </div>
            <div class="w-full h-[50vh] sm:h-[60vh] bg-black rounded-lg overflow-hidden flex justify-center items-center">
                <img id="crop-image" class="max-w-full max-h-full">
            </div>
            <div class="flex justify-end gap-3 mt-5">
            <button type="button" @click="cancelCrop()" class="px-5 py-2.5 bg-red-600 hover:bg-red-500 rounded-lg text-white transition">Batal</button>
                <button type="button" @click="skipCrop()" class="px-5 py-2.5 bg-gray-600 hover:bg-gray-500 rounded-lg text-white transition">Lewati</button>
                <button type="button" @click="applyCrop()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 rounded-lg text-white font-bold shadow-lg transition">Selesai Crop</button>
            </div>
        </div>
    </div>
</div>
                </div>
                
                <div class="flex flex-col sm:flex-row gap-3 mt-6">
                    <button type="submit" class="flex-1 bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-3 rounded-lg transition shadow-lg shadow-yellow-500/30">
                        <i class="fas fa-save mr-2"></i> Perbarui Kegiatan
                    </button>
                    
                   <a href="{{ url_for('logbook_delete_entry', logbook_id=logbook.id, entry_id=entry.id) }}" 
   onclick="handleCustomDelete(event, 'Hapus Kegiatan?', 'Yakin ingin menghapus kegiatan ini? Data tidak bisa dikembalikan!')" 
   class="sm:flex-none w-full sm:w-auto bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-lg transition shadow-lg shadow-red-500/30 text-center flex justify-center items-center">
    <i class="fas fa-trash-alt mr-2"></i> Hapus
</a>
                </div>
            </form>
        </div>
    </div>
    <div x-data="{}" x-show="$store.confirm.isOpen" class="fixed inset-0 z-[999] flex items-center justify-center px-4" x-cloak>
        <div x-show="$store.confirm.isOpen" 
             x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
             x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
             class="fixed inset-0 bg-black/80 backdrop-blur-sm"
             @click="$store.confirm.close(false)"></div>

        <div x-show="$store.confirm.isOpen" 
             x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 scale-90 translate-y-4" x-transition:enter-end="opacity-100 scale-100 translate-y-0"
             x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100 scale-100 translate-y-0" x-transition:leave-end="opacity-0 scale-90 translate-y-4"
             class="relative bg-gray-800 border border-gray-700 rounded-2xl p-6 w-full max-w-sm shadow-2xl text-center">
            
            <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-red-900/30 mb-4">
                <i class="fas fa-exclamation-triangle text-3xl text-red-500"></i>
            </div>
            
            <h3 class="text-xl font-bold text-white mb-2" x-text="$store.confirm.title"></h3>
            <p class="text-gray-400 text-sm mb-6" x-text="$store.confirm.message"></p>
            
            <div class="flex gap-3 w-full">
                <button @click="$store.confirm.close(false)" class="flex-1 px-4 py-3 bg-gray-700 hover:bg-gray-600 text-white rounded-xl font-medium transition">
                    Batal
                </button>
                <button @click="$store.confirm.close(true)" class="flex-1 px-4 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold transition shadow-lg shadow-red-500/30">
                    Ya, Hapus
                </button>
            </div>
        </div>
    </div>
    <!-- {% include 'nativeNav.html' %} -->
    
    <script>
    document.addEventListener('alpine:init', () => {
    // --- KOMPONEN EDITOR TIPTAP (Fix ProseMirror Conflict) ---
    Alpine.data('tiptapEditor', (initialContent = '') => ({
        editor: null,
        content: initialContent,
        async init() {
            try {
                // KUNCINYA DI SINI: Pakai esm.sh agar ProseMirror tidak bentrok!
                const { Editor } = await import('https://esm.sh/@tiptap/core@2.2.4');
                const { default: StarterKit } = await import('https://esm.sh/@tiptap/starter-kit@2.2.4');
                
                const _this = this;
                
                this.editor = new Editor({
                    element: this.$refs.editorElement,
                    extensions: [StarterKit],
                    content: this.content,
                    editorProps: {
                        attributes: {
                            class: 'focus:outline-none min-h-[150px] p-4 text-gray-300 editor-content',
                        },
                    },
                    onUpdate: ({ editor }) => {
                        _this.content = editor.getHTML();
                    }
                });
            } catch (error) {
                console.error("Gagal load Tiptap:", error);
            }
        },
        destroy() {
            if (this.editor) {
                this.editor.destroy();
            }
        }
    }));
        Alpine.data('imageCropUploader', (initialImages = []) => ({
            existingImages: initialImages, // Menyimpan gambar dari database {path, url}
            newImages: [], // Menyimpan gambar baru hasil crop {blob, url}
            filesToCrop: [],
            currentFileIndex: 0,
            showModal: false,
            cropper: null,
            isDragging: false,

            handleFiles(e) {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                this.filesToCrop = files;
                this.currentFileIndex = 0;
                this.startCropping();
            },
handleDrop(e) {
            this.isDragging = false; // Matiin efek nyala
            const files = Array.from(e.dataTransfer.files);
            this.processFiles(files);
        },
        processFiles(files) {
            if (files.length === 0) return;
            
            // Filter biar cuma gambar aja yang masuk antrean
            const imageFiles = files.filter(file => file.type.startsWith('image/'));
            
            if (imageFiles.length === 0) {
                if (typeof window.showAlert === 'function') {
                    window.showAlert('error', 'Hanya file gambar yang diperbolehkan!');
                } else {
                    alert('Hanya file gambar yang diperbolehkan!');
                }
                return;
            }

            this.filesToCrop = imageFiles;
            this.currentFileIndex = 0;
            this.startCropping();
        },
            startCropping() {
                if (this.currentFileIndex < this.filesToCrop.length) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        this.showModal = true;
                        this.$nextTick(() => {
                            const image = document.getElementById('crop-image');
                            image.src = e.target.result;
                            if (this.cropper) this.cropper.destroy();
                            this.cropper = new Cropper(image, { viewMode: 1, autoCropArea: 1, responsive: true });
                        });
                    };
                    reader.readAsDataURL(this.filesToCrop[this.currentFileIndex]);
                } else {
                    this.showModal = false;
                    this.updateInputFile();
                }
            },
cancelCrop() {
            this.showModal = false;          // Tutup modal
            this.filesToCrop = [];           // Kosongkan sisa antrean file
            this.currentFileIndex = 0;       // Reset index
            
            if (this.cropper) {
                this.cropper.destroy();      // Matikan engine cropper
                this.cropper = null;
            }
            
            this.updateInputFile();          // Sync file yang udah terlanjur di-crop (kalau ada)
            
            // Opsional: Kasih notif kalau lu mau
            if (typeof window.showAlert === 'function') {
                window.showAlert('info', 'Proses upload gambar dibatalkan.');
            }
        },
            applyCrop() {
                this.cropper.getCroppedCanvas({ maxWidth: 1200, maxHeight: 1200 }).toBlob((blob) => {
                    this.newImages.push({ blob: blob, url: URL.createObjectURL(blob) });
                    this.nextFile();
                }, 'image/jpeg', 0.8);
            },

            skipCrop() {
                const file = this.filesToCrop[this.currentFileIndex];
                this.newImages.push({ blob: file, url: URL.createObjectURL(file) });
                this.nextFile();
            },

            nextFile() {
                this.currentFileIndex++;
                this.startCropping();
            },

            // Fitur Hapus Gambar Lama
            removeExisting(index) {
                this.existingImages.splice(index, 1);
            },

            // Fitur Hapus Gambar Baru
            removeNew(index) {
                this.newImages.splice(index, 1);
                this.updateInputFile();
            },

            updateInputFile() {
                const dataTransfer = new DataTransfer();
                this.newImages.forEach((img, i) => {
                    const file = new File([img.blob], `new_image_${i}.jpg`, { type: "image/jpeg" });
                    dataTransfer.items.add(file);
                });
                this.$refs.fileInput.files = dataTransfer.files;
            }
        }));
    });
async function handleCustomDelete(event, title, message) {
        // Tahan klik agar tidak langsung pindah halaman
        event.preventDefault(); 
        
        // Ambil URL target penghapusan dari atribut href
        const deleteUrl = event.currentTarget.getAttribute('href');

        // Cek apakah fungsi showConfirm dari ui.js tersedia
        if (typeof window.showConfirm === 'function') {
            // Tunggu user ngeklik "Ya" (true) atau "Batal" (false)
            const isConfirmed = await window.showConfirm(title, message, 'danger');
            
            // Jika user klik "Ya"
            if (isConfirmed) {
                window.location.href = deleteUrl; // Eksekusi penghapusan
            }
        } else {
            // Fallback (jaga-jaga kalau ui.js gagal dimuat)
            if (confirm(message)) {
                window.location.href = deleteUrl;
            }
        }
    }
    document.addEventListener('DOMContentLoaded', function() {
        const textareas = document.querySelectorAll('.auto-bullet');

        textareas.forEach(textarea => {
            textarea.addEventListener('keydown', function(e) {
                // Hanya eksekusi jika tombol yang ditekan adalah Enter
                if (e.key === 'Enter') {
                    const start = this.selectionStart;
                    const end = this.selectionEnd;
                    const value = this.value;

                    // Ambil teks dari awal sampai posisi kursor saat ini
                    const textBeforeCursor = value.substring(0, start);
                    // Ambil baris terakhir yang sedang diketik
                    const lines = textBeforeCursor.split('\n');
                    const currentLine = lines[lines.length - 1];

                    // Deteksi pola bullet: "-", "*", atau angka "1.", "2." diikuti spasi
                    const bulletRegex = /^(\s*[-*]\s+|\s*\d+\.\s+)/;
                    const match = currentLine.match(bulletRegex);

                    if (match) {
                        e.preventDefault(); // Stop fungsi Enter bawaan
                        
                        let bullet = match[1]; // Dapatkan bulletnya (misal: "- ")
                        const lineContent = currentLine.substring(bullet.length);

                        // Fitur ala Google Keep: Kalau barisnya kosong (cuma ada bullet),
                        // tekan Enter bakal ngehapus bulletnya dan balik ke baris normal
                        if (lineContent.trim() === '') {
                            this.value = value.substring(0, start - bullet.length) + value.substring(end);
                            this.selectionStart = this.selectionEnd = start - bullet.length;
                        } else {
                            // Kalau ada isinya, bikin baris baru + bullet yang sama
                            let insertText = '\n' + bullet;
                            
                            // Fitur tambahan: Auto-increment untuk list angka (1. -> 2. -> 3.)
                            const numberMatch = bullet.match(/\d+/);
                            if (numberMatch) {
                                const num = parseInt(numberMatch[0]);
                                insertText = '\n' + bullet.replace(/\d+/, num + 1);
                            }

                            // Sisipkan ke dalam textarea
                            this.value = value.substring(0, start) + insertText + value.substring(end);
                            
                            // Kembalikan kursor ke posisi yang tepat
                            this.selectionStart = this.selectionEnd = start + insertText.length;
                        }
                    }
                }
            });
        });
    });
    // Inisialisasi Flatpickr
    flatpickr(".datepicker", {
        altInput: true,          // Mengaktifkan fitur ilusi (tampilan vs data asli berbeda)
        altFormat: "d-m-Y",      // Format yang DILIHAT oleh user (dd-mm-yyyy)
        dateFormat: "Y-m-d",     // Format yang DIKIRIM ke database Python (yyyy-mm-dd)
        disableMobile: "true"    // Memaksa HP pakai kalender Flatpickr, bukan bawaan browser
    });
</script>
