<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Kegiatan - The Putras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        ::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    </style>
</head>
<body class="bg-gray-900 text-gray-300 font-sans min-h-screen flex flex-col">
    <div class="flex-1 container mx-auto p-4 sm:p-6 pb-32 max-w-3xl">
        
        <div class="mb-6 flex items-center gap-3">
            <a href="{{ url_for('logbook_detail', logbook_id=logbook.id) }}" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-800 hover:bg-gray-700 text-white transition">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1 class="text-2xl font-bold text-white">Edit Kegiatan Harian</h1>
        </div>

        <div class="bg-gray-800 rounded-2xl shadow-xl border border-white/5 p-6 sm:p-8">
            <form method="POST" enctype="multipart/form-data">
                <div class="grid grid-cols-1 gap-4 mb-4">
                    <div>
                        <label class="block text-sm mb-1 text-gray-400">Tanggal</label>
                        <input type="text" name="tanggal" value="{{ entry.tanggal }}" required class="datepicker w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:border-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm mb-1 text-gray-400">Aktivitas / Judul</label>
                        <input type="text" name="aktivitas" value="{{ entry.aktivitas }}" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:border-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm mb-1 text-gray-400">Deskripsi Pekerjaan</label>
                        <textarea name="deskripsi" rows="5" required class="auto-bullet w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:border-blue-500 focus:outline-none">{{ entry.deskripsi }}</textarea>
                    </div>
                    
                    <div x-data="imageCropUploader('{% if entry.gambar %}{{ url_for('static', filename='uploads/logbook/' ~ entry.gambar) }}{% endif %}')" class="mt-4">
    <label class="block text-sm mb-2 text-gray-400">Bukti Gambar Pekerjaan</label>
    
    <input type="hidden" name="hapus_gambar_lama" :value="hapusLama">

    <div x-show="existingImage || newImagePreview" class="relative inline-block mb-3 group" x-cloak>
        <img :src="newImagePreview || existingImage" class="max-h-[300px] rounded-lg border border-gray-600 shadow-sm object-contain">
        
        <button type="button" @click="removeImage()" class="absolute -top-3 -right-3 bg-red-500 text-white rounded-full w-8 h-8 flex items-center justify-center shadow-lg hover:bg-red-600 transform scale-0 group-hover:scale-100 transition-transform duration-200">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <p x-show="!existingImage && !newImagePreview" class="text-sm text-gray-500 italic mb-3">Tidak ada gambar</p>

    <input type="file" x-ref="fileInput" name="gambar" accept="image/*" @change="fileChanged" class="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 bg-gray-900 border border-gray-600 rounded-lg p-1 cursor-pointer">

    <div x-show="showModal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 p-4" x-cloak>
        <div class="bg-gray-800 rounded-xl p-4 w-full max-w-3xl flex flex-col shadow-2xl border border-gray-600">
            <h3 class="text-white font-bold mb-4">Sesuaikan Area Gambar</h3>
            
            <div class="w-full h-[50vh] sm:h-[65vh] bg-black rounded-lg overflow-hidden flex justify-center items-center">
                <img id="crop-image" class="max-w-full max-h-full">
            </div>
            
            <div class="flex justify-end gap-3 mt-5">
                <button type="button" @click="cancelCrop()" class="px-5 py-2.5 bg-gray-600 hover:bg-gray-500 rounded-lg text-white font-medium transition">Batal</button>
                <button type="button" @click="applyCrop()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 rounded-lg text-white font-bold shadow-lg shadow-blue-500/30 transition">Selesai Crop</button>
            </div>
        </div>
    </div>
</div>
                </div>
                
                <div class="flex flex-col sm:flex-row gap-3 mt-6">
                    <button type="submit" class="flex-1 bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-3 rounded-lg transition shadow-lg shadow-yellow-500/30">
                        <i class="fas fa-save mr-2"></i> Perbarui Kegiatan
                    </button>
                    
                    <a href="{{ url_for('logbook_delete_entry', logbook_id=logbook.id, entry_id=entry.id) }}" onclick="return confirm('Yakin ingin menghapus kegiatan ini? Data tidak bisa dikembalikan!')" class="sm:flex-none w-full sm:w-auto bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-lg transition shadow-lg shadow-red-500/30 text-center flex justify-center items-center">
                        <i class="fas fa-trash-alt mr-2"></i> Hapus
                    </a>
                </div>
            </form>
        </div>
    </div>
    {% include 'nativeNav.html' %}
    <script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('imageCropUploader', (initialImage) => ({
            existingImage: initialImage,
            newImagePreview: null,
            showModal: false,
            hapusLama: 0,
            cropper: null,
            
            fileChanged(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    this.showModal = true;
                    // Buka modal dulu, baru pasang cropper di frame berikutnya
                    this.$nextTick(() => {
                        const image = document.getElementById('crop-image');
                        image.src = event.target.result;
                        
                        // Hancurkan instance lama kalau ada
                        if (this.cropper) {
                            this.cropper.destroy();
                        }
                        
                        // Setup Cropper
                        this.cropper = new Cropper(image, {
                            viewMode: 1,      // Gak boleh keluar dari canvas
                            dragMode: 'move',
                            autoCropArea: 1,
                            restore: false,
                            guides: true,
                            center: true,
                            highlight: false,
                            cropBoxMovable: true,
                            cropBoxResizable: true,
                            toggleDragModeOnDblclick: false,
                        });
                    });
                };
                reader.readAsDataURL(file);
            },
            
            applyCrop() {
                if (!this.cropper) return;
                
                // Ambil hasil crop
                this.cropper.getCroppedCanvas({
                    maxWidth: 1500,
                    maxHeight: 1500
                }).toBlob((blob) => {
                    // Tampilkan preview di layar
                    this.newImagePreview = URL.createObjectURL(blob);
                    
                    // --- MAGIC TRICK: Masukin hasil crop ke input file form asli ---
                    const file = new File([blob], "cropped_image.jpg", { type: "image/jpeg", lastModified: new Date().getTime() });
                    const dataTransfer = new DataTransfer();
                    dataTransfer.items.add(file);
                    this.$refs.fileInput.files = dataTransfer.files;
                    // -------------------------------------------------------------
                    
                    // Bersihkan state
                    this.showModal = false;
                    this.hapusLama = 0; // Batalkan niat hapus gambar kalau tadinya diklik X
                }, 'image/jpeg', 0.85); // Compress 85% dari frontend biar lebih enteng
            },
            
            cancelCrop() {
                this.showModal = false;
                this.$refs.fileInput.value = ''; // Reset input file
                if(this.cropper) this.cropper.destroy();
            },
            
            removeImage() {
                // Sembunyikan semua gambar & kirim sinyal hapus ke Python
                this.existingImage = null;
                this.newImagePreview = null;
                this.$refs.fileInput.value = '';
                this.hapusLama = 1; 
            }
        }));
    });
    document.addEventListener('DOMContentLoaded', function() {
        const textareas = document.querySelectorAll('.auto-bullet');

        textareas.forEach(textarea => {
            textarea.addEventListener('keydown', function(e) {
                // Hanya eksekusi jika tombol yang ditekan adalah Enter
                if (e.key === 'Enter') {
                    const start = this.selectionStart;
                    const end = this.selectionEnd;
                    const value = this.value;

                    // Ambil teks dari awal sampai posisi kursor saat ini
                    const textBeforeCursor = value.substring(0, start);
                    // Ambil baris terakhir yang sedang diketik
                    const lines = textBeforeCursor.split('\n');
                    const currentLine = lines[lines.length - 1];

                    // Deteksi pola bullet: "-", "*", atau angka "1.", "2." diikuti spasi
                    const bulletRegex = /^(\s*[-*]\s+|\s*\d+\.\s+)/;
                    const match = currentLine.match(bulletRegex);

                    if (match) {
                        e.preventDefault(); // Stop fungsi Enter bawaan
                        
                        let bullet = match[1]; // Dapatkan bulletnya (misal: "- ")
                        const lineContent = currentLine.substring(bullet.length);

                        // Fitur ala Google Keep: Kalau barisnya kosong (cuma ada bullet),
                        // tekan Enter bakal ngehapus bulletnya dan balik ke baris normal
                        if (lineContent.trim() === '') {
                            this.value = value.substring(0, start - bullet.length) + value.substring(end);
                            this.selectionStart = this.selectionEnd = start - bullet.length;
                        } else {
                            // Kalau ada isinya, bikin baris baru + bullet yang sama
                            let insertText = '\n' + bullet;
                            
                            // Fitur tambahan: Auto-increment untuk list angka (1. -> 2. -> 3.)
                            const numberMatch = bullet.match(/\d+/);
                            if (numberMatch) {
                                const num = parseInt(numberMatch[0]);
                                insertText = '\n' + bullet.replace(/\d+/, num + 1);
                            }

                            // Sisipkan ke dalam textarea
                            this.value = value.substring(0, start) + insertText + value.substring(end);
                            
                            // Kembalikan kursor ke posisi yang tepat
                            this.selectionStart = this.selectionEnd = start + insertText.length;
                        }
                    }
                }
            });
        });
    });
    // Inisialisasi Flatpickr
    flatpickr(".datepicker", {
        altInput: true,          // Mengaktifkan fitur ilusi (tampilan vs data asli berbeda)
        altFormat: "d-m-Y",      // Format yang DILIHAT oleh user (dd-mm-yyyy)
        dateFormat: "Y-m-d",     // Format yang DIKIRIM ke database Python (yyyy-mm-dd)
        disableMobile: "true"    // Memaksa HP pakai kalender Flatpickr, bukan bawaan browser
    });
</script>
</body>
</html>
