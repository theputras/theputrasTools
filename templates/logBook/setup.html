<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Edit' if logbook else 'Setup' }} Logbook - The Putras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        /* Styling khusus input date biar icon kalendernya warna putih di chrome */
        ::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    </style>
</head>
<body class="bg-gray-900 text-gray-300 font-sans min-h-screen flex flex-col">
    <div class="flex-1 container mx-auto p-4 sm:p-6 pb-32 max-w-3xl">
        
        <div class="mb-6 flex items-center gap-3">
            <a href="{{ url_for('logbook_list') }}" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-800 hover:bg-gray-700 text-white transition">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1 class="text-2xl font-bold text-white">{{ 'Edit Identitas Logbook' if logbook else 'Setup Logbook Baru' }}</h1>
        </div>

        <div class="bg-gray-800 rounded-2xl shadow-xl border border-white/5 p-6 sm:p-8">
            <form method="POST">
                
                <h3 class="text-lg font-semibold text-blue-400 mb-4 border-b border-gray-700 pb-2">Data Mahasiswa</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div><label class="block text-sm mb-1 text-gray-400">Nama Mahasiswa</label><input type="text" name="nama" value="{{ logbook.nama if logbook else '' }}" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:border-blue-500 focus:outline-none"></div>
                    <div><label class="block text-sm mb-1 text-gray-400">NIM</label><input type="text" name="nim" value="{{ logbook.nim if logbook else '' }}" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:border-blue-500 focus:outline-none"></div>
                    <div><label class="block text-sm mb-1 text-gray-400">Fakultas</label><input type="text" name="fakultas" value="{{ logbook.fakultas if logbook else '' }}" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:border-blue-500 focus:outline-none"></div>
                    <div><label class="block text-sm mb-1 text-gray-400">Prodi</label><input type="text" name="prodi" value="{{ logbook.prodi if logbook else '' }}" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:border-blue-500 focus:outline-none"></div>
                </div>

                <h3 class="text-lg font-semibold text-blue-400 mb-4 border-b border-gray-700 pb-2">Data Mitra & Magang</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div class="md:col-span-2"><label class="block text-sm mb-1 text-gray-400">Nama Mitra / Perusahaan</label><input type="text" name="nama_mitra" value="{{ logbook.nama_mitra if logbook else '' }}" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:border-blue-500 focus:outline-none"></div>
                    <div><label class="block text-sm mb-1 text-gray-400">Posisi Magang</label><input type="text" name="posisi_magang" value="{{ logbook.posisi_magang if logbook else '' }}" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:border-blue-500 focus:outline-none"></div>
                    <div><label class="block text-sm mb-1 text-gray-400">Nama Mentor</label><input type="text" name="nama_mentor" value="{{ logbook.nama_mentor if logbook else '' }}" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:border-blue-500 focus:outline-none"></div>
                    <div><label class="block text-sm mb-1 text-gray-400">WhatsApp Mentor</label><input type="text" name="wa_mentor" value="{{ logbook.wa_mentor if logbook else '' }}" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:border-blue-500 focus:outline-none"></div>
                    <div><label class="block text-sm mb-1 text-gray-400">Email Mentor</label><input type="email" name="email_mentor" value="{{ logbook.email_mentor if logbook else '' }}" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:border-blue-500 focus:outline-none"></div>
                    <div><label class="block text-sm mb-1 text-gray-400">Waktu Mulai</label><input type="text" name="waktu_mulai" value="{{ logbook.waktu_mulai if logbook else '' }}" required class="datepicker w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:border-blue-500 focus:outline-none"></div>
                    <div><label class="block text-sm mb-1 text-gray-400">Waktu Selesai</label><input type="text" name="waktu_selesai" value="{{ logbook.waktu_selesai if logbook else '' }}" required class="datepicker w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:border-blue-500 focus:outline-none"></div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow-lg shadow-blue-500/30">
                    <i class="fas fa-save mr-2"></i> Simpan Data Logbook
                </button>
            </form>
        </div>
    </div>
    {% include 'nativeNav.html' %}
    <script>
    // Inisialisasi Flatpickr
    flatpickr(".datepicker", {
        altInput: true,          // Mengaktifkan fitur ilusi (tampilan vs data asli berbeda)
        altFormat: "d-m-Y",      // Format yang DILIHAT oleh user (dd-mm-yyyy)
        dateFormat: "Y-m-d",     // Format yang DIKIRIM ke database Python (yyyy-mm-dd)
        disableMobile: "true"    // Memaksa HP pakai kalender Flatpickr, bukan bawaan browser
    });
</script>
</body>
</html>
