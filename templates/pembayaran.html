<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran QRIS - The Putras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        .qr-container {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1) 0%, rgba(59, 130, 246, 0.1) 100%);
        }
        .glass-card {
            background: rgba(31, 41, 55, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .input-glow:focus {
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.3);
        }
        .btn-gradient {
            background: linear-gradient(135deg, #8B5CF6 0%, #6366F1 100%);
        }
        .btn-gradient:hover {
            background: linear-gradient(135deg, #7C3AED 0%, #4F46E5 100%);
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.3); }
            50% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.5); }
        }
        .qr-glow {
            animation: pulse-glow 2s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-300 font-sans min-h-screen flex flex-col">
    
    <div class="flex-1 flex flex-col items-center pt-6 pb-32 px-4 w-full" x-data="qrisApp()">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <a href="{{ url_for('tools_page') }}" class="inline-flex items-center text-gray-400 hover:text-white mb-4 transition-colors">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Kembali
            </a>
            <h1 class="text-2xl font-bold text-white tracking-tight">Pembayaran QRIS</h1>
            <p class="text-gray-400 text-sm mt-2">Generate QR Code untuk pembayaran</p>
        </div>
        
        <!-- Payment Method Menu -->
        <div class="w-full max-w-md mb-6">
            <div class="glass-card p-1.5 rounded-xl flex gap-2">
                <!-- QR Merchant (Active) -->
                <button class="flex-1 py-2.5 px-4 rounded-lg bg-violet-600 shadow-lg shadow-violet-500/20 text-white font-medium text-sm transition-all">
                    Payment QR Merchant
                </button>
                
                <!-- Midtrans (Coming Soon) -->
                <div class="flex-1 relative group cursor-not-allowed">
                    <button disabled class="w-full h-full py-2.5 px-4 rounded-lg hover:bg-white/5 text-gray-400 font-medium text-sm transition-all disabled:opacity-60 disabled:cursor-not-allowed">
                        Payment with Midtrans
                    </button>
                    <span class="absolute -top-2 -right-2 px-2 py-0.5 bg-gray-700 border border-gray-600 text-[10px] text-gray-300 rounded-full shadow-lg transform rotate-3">
                        Soon
                    </span>
                </div>
            </div>
        </div>

        <!-- Main Card -->
        <div class="w-full max-w-md">
            
            <!-- Input Form -->
            <div class="glass-card rounded-2xl p-6 mb-4">
                <label class="block text-sm font-medium text-gray-300 mb-2">
                    Nominal Pembayaran
                </label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 font-medium">Rp</span>
                    <input 
                        type="text" 
                        x-model="amountInput"
                        @input="formatAmount($event)"
                        @keyup.enter="generateQris()"
                        placeholder="0"
                        class="w-full bg-gray-800/50 border border-gray-700 rounded-xl py-4 pl-12 pr-4 
                               text-white text-xl font-semibold placeholder-gray-500
                               focus:outline-none focus:border-violet-500 input-glow transition-all"
                    >
                </div>
                
                <!-- Quick Amount Buttons -->
                <div class="grid grid-cols-3 gap-2 mt-4">
                    <template x-for="preset in [5000, 10000, 15000, 20000, 50000, 100000]" :key="preset">
                        <button 
                            @click="setAmount(preset)"
                            class="py-2 px-3 bg-gray-800/50 border border-gray-700 rounded-lg text-sm text-gray-300
                                   hover:bg-violet-500/20 hover:border-violet-500/50 transition-all"
                            x-text="formatRupiah(preset)"
                        ></button>
                    </template>
                </div>
                
                <!-- Generate Button -->
                <button 
                    @click="generateQris()"
                    :disabled="loading || !rawAmount || qrData"
                    class="w-full mt-6 py-4 rounded-xl font-semibold text-white btn-gradient
                           disabled:opacity-50 disabled:cursor-not-allowed
                           transform active:scale-95 transition-all duration-200"
                >
                    <span x-show="!loading" class="flex items-center justify-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z">
                            </path>
                        </svg>
                        Generate QRIS
                    </span>
                    <span x-show="loading" class="flex items-center justify-center">
                        <svg class="animate-spin h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                        </svg>
                        Generating...
                    </span>
                </button>
            </div>
            
            <!-- Error Message -->
            <div x-show="error" x-cloak 
                 class="glass-card rounded-2xl p-4 mb-4 border-red-500/30 bg-red-500/10">
                <div class="flex items-center text-red-400">
                    <svg class="w-5 h-5 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                              d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span x-text="error" class="text-sm"></span>
                </div>
            </div>
            
            <!-- QR Code Result -->
            <div x-show="qrData" x-cloak class="glass-card rounded-2xl p-6">
                <div class="text-center mb-4">
                    <p class="text-gray-400 text-sm">Total Pembayaran</p>
                    <p class="text-2xl font-bold text-white" x-text="qrData?.amount_formatted"></p>
                </div>
                
                <!-- QR Code Display -->
                <div class="qr-container rounded-2xl p-6 flex justify-center qr-glow">
                    <div class="bg-white rounded-xl p-4" x-html="qrData?.qr_svg"></div>
                </div>
                
                <!-- Countdown Timer -->
                <div x-show="countdown" class="flex items-center justify-center gap-2 mt-4 py-2 px-4 bg-gray-800/50 rounded-lg">
                    <svg class="w-4 h-4" :class="countdown && countdown.startsWith('0') ? 'text-orange-400' : 'text-violet-400'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span class="text-sm" :class="countdown && countdown.startsWith('0') ? 'text-orange-400' : 'text-gray-300'">
                        Berlaku <span class="font-mono font-semibold" x-text="countdown"></span>
                    </span>
                </div>
                
                <p class="text-center text-gray-400 text-xs mt-4">
                    Scan QR Code dengan aplikasi e-wallet atau mobile banking
                </p>
                
                <!-- Action Buttons -->
                <div class="flex gap-3 mt-4">
                    <button 
                        @click="resetQris()"
                        class="flex-1 py-3 rounded-xl font-medium text-gray-300
                               bg-gray-800/50 border border-gray-700
                               hover:bg-gray-700 transition-all"
                    >
                        Generate Baru
                    </button>
                </div>
            </div>
            
        </div>
    </div>

    {% include 'muslimTools/prayerWidget.html' %}
    {% include 'nativeNav.html' %}

    <script>
        const STORAGE_KEY = 'qris_payment_data';
        const EXPIRY_DURATION = 10 * 60 * 1000; // 10 menit dalam ms

        function qrisApp() {
            return {
                amountInput: '',
                rawAmount: 0,
                loading: false,
                error: null,
                qrData: null,
                expiryTime: null,
                countdown: '',
                countdownInterval: null,

                init() {
                    // Load dari localStorage saat init
                    this.loadFromStorage();
                },

                loadFromStorage() {
                    try {
                        const stored = localStorage.getItem(STORAGE_KEY);
                        if (stored) {
                            const parsed = JSON.parse(stored);
                            const now = Date.now();
                            
                            // Cek apakah masih valid (belum expired)
                            if (parsed.expiryTime && parsed.expiryTime > now) {
                                this.qrData = parsed.qrData;
                                this.expiryTime = parsed.expiryTime;
                                this.rawAmount = parsed.qrData?.amount || 0;
                                this.amountInput = this.rawAmount ? new Intl.NumberFormat('id-ID').format(this.rawAmount) : '';
                                this.startCountdown();
                            } else {
                                // Sudah expired, hapus dari storage
                                this.clearStorage();
                            }
                        }
                    } catch (e) {
                        console.error('Error loading from storage:', e);
                        this.clearStorage();
                    }
                },

                saveToStorage() {
                    try {
                        const data = {
                            qrData: this.qrData,
                            expiryTime: this.expiryTime
                        };
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                    } catch (e) {
                        console.error('Error saving to storage:', e);
                    }
                },

                clearStorage() {
                    localStorage.removeItem(STORAGE_KEY);
                },

                startCountdown() {
                    // Clear interval sebelumnya jika ada
                    if (this.countdownInterval) {
                        clearInterval(this.countdownInterval);
                    }

                    this.updateCountdown();
                    this.countdownInterval = setInterval(() => {
                        this.updateCountdown();
                    }, 1000);
                },

                updateCountdown() {
                    if (!this.expiryTime) {
                        this.countdown = '';
                        return;
                    }

                    const now = Date.now();
                    const remaining = this.expiryTime - now;

                    if (remaining <= 0) {
                        // Expired!
                        this.handleExpiry();
                        return;
                    }

                    const minutes = Math.floor(remaining / 60000);
                    const seconds = Math.floor((remaining % 60000) / 1000);
                    this.countdown = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                },

                handleExpiry() {
                    // Stop countdown
                    if (this.countdownInterval) {
                        clearInterval(this.countdownInterval);
                        this.countdownInterval = null;
                    }
                    
                    // Clear data
                    this.qrData = null;
                    this.expiryTime = null;
                    this.countdown = '';
                    this.clearStorage();
                    
                    // Show notification
                    this.error = 'QR Code telah kadaluarsa. Silakan generate ulang.';
                },

                formatAmount(e) {
                    let value = e.target.value.replace(/\D/g, '');
                    this.rawAmount = parseInt(value) || 0;
                    
                    if (value) {
                        this.amountInput = new Intl.NumberFormat('id-ID').format(value);
                    } else {
                        this.amountInput = '';
                    }
                },

                setAmount(amount) {
                    this.rawAmount = amount;
                    this.amountInput = new Intl.NumberFormat('id-ID').format(amount);
                },

                formatRupiah(amount) {
                    if (amount >= 1000) {
                        return (amount / 1000) + 'rb';
                    }
                    return amount;
                },

                async generateQris() {
                    if (!this.rawAmount || this.rawAmount <= 0) {
                        this.error = 'Masukkan nominal pembayaran';
                        return;
                    }

                    this.loading = true;
                    this.error = null;
                    this.qrData = null;
                    this.expiryTime = null;

                    // Stop countdown sebelumnya
                    if (this.countdownInterval) {
                        clearInterval(this.countdownInterval);
                    }

                    try {
                        const response = await fetch('/api/pembayaran/generate', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ amount: this.rawAmount })
                        });

                        const result = await response.json();

                        if (result.success) {
                            this.qrData = result.data;
                            this.expiryTime = Date.now() + EXPIRY_DURATION;
                            
                            // Simpan ke localStorage
                            this.saveToStorage();
                            
                            // Mulai countdown
                            this.startCountdown();
                        } else {
                            this.error = result.error || 'Gagal generate QRIS';
                        }
                    } catch (err) {
                        this.error = 'Terjadi kesalahan. Coba lagi.';
                        console.error(err);
                    } finally {
                        this.loading = false;
                    }
                },

                resetQris() {
                    // Stop countdown
                    if (this.countdownInterval) {
                        clearInterval(this.countdownInterval);
                        this.countdownInterval = null;
                    }
                    
                    this.qrData = null;
                    this.expiryTime = null;
                    this.countdown = '';
                    this.amountInput = '';
                    this.rawAmount = 0;
                    this.error = null;
                    
                    // Hapus dari localStorage
                    this.clearStorage();
                }
            }
        }
    </script>
</body>
</html>
